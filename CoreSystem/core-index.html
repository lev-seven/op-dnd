<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

<title>C.O.R.E. — TTRPG App</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0c0c10;--s1:#131318;--s2:#1a1a22;--s3:#21212c;--b1:#2a2a38;--b2:#3a3a4e;--tx:#dddae8;--tx2:#9996aa;--tx3:#55536a;--gold:#e8a030;--gbg:#3a2810;--green:#48c88a;--red:#e05050;--blue:#5890e8;--purple:#a070e8;--cyan:#40c8c8;--app-h:100vh;--app-h:100dvh;--safe-bottom:env(safe-area-inset-bottom,0px)}
html{height:var(--app-h);overflow:hidden}

@keyframes spin{to{transform:rotate(360deg)}}

<script>window.GITHUB_BASE="https://lev-seven.github.io/op-dnd/";</script>

<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const{useState,useEffect,useCallback,useRef}=React;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const BASE=()=>{let b=window.GITHUB_BASE||"";if(b.endsWith("/"))b=b.slice(0,-1);return b;};
async function fetchJ(u){try{const r=await fetch(u+"?t="+Date.now());if(!r.ok)return null;return await r.json();}catch{return null;}}
async function H(s){const e=new TextEncoder().encode(s);const h=await crypto.subtle.digest("SHA-256",e);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");}
function hex2b(h){const b=new Uint8Array(h.length/2);for(let i=0;i<h.length;i+=2)b[i/2]=parseInt(h.substr(i,2),16);return b;}
async function aesDec(stored,passHash){try{const{i,d}=JSON.parse(stored);const k=await crypto.subtle.importKey("raw",hex2b(passHash).slice(0,32),{name:"AES-GCM"},false,["decrypt"]);const dec=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(i)},k,new Uint8Array(d));return new TextDecoder().decode(dec);}catch{return null;}}
async function ghPut(path,content,token,accId,isMaster,accName){
  if(!isMaster&&accId){const allowed=path==="data/manifest.json"||path.startsWith(`data/${accId}/`);if(!allowed)return false;}
  const u=new URL(BASE());const user=u.hostname.split(".")[0];const repo=u.pathname.replace(/^\/|\/$/g,"");
  const api=`https://api.github.com/repos/${user}/${repo}/contents/${path}`;
  const hd={"Authorization":`token ${token}`,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  let sha=null;try{const r=await fetch(api+"?t="+Date.now(),{headers:{...hd,"If-None-Match":""},cache:"no-store"});if(r.ok){sha=(await r.json()).sha;}}catch{}
  const body={message:`[${accName||accId||"?"}] Update ${path}`,content:btoa(unescape(encodeURIComponent(content)))};
  if(sha)body.sha=sha;
  return(await fetch(api,{method:"PUT",headers:{...hd,"Content-Type":"application/json"},body:JSON.stringify(body)})).ok;
}

/* ═══ CORE HELPERS ═══ */
const G=window;
function tById(id){return(G.TALENTS||[]).find(t=>t.id===id)}
function sById(id){return(G.SPELLS||[]).find(s=>s.id===id)}
function aById(id){return(G.AUGMENTS||[]).find(a=>a.id===id)}
function catCap(c){return c.talenti.includes('cap_15')?15:c.talenti.includes('cap_12')?12:10}
function hpMax(c){return c.corpo+c.mente+c.anima}
function hpPct(c){const mx=hpMax(c);return mx>0?Math.max(0,c.hpCurrent/mx):0;}
function woundTier(c){const mx=hpMax(c),lost=mx-c.hpCurrent,t=Math.floor(mx/3);if(c.hpCurrent<=0)return 3;if(lost>=t*2)return 2;if(lost>=t)return 1;return 0;}
function wInfo(t){return(G.WOUND_TIERS||[])[Math.min(t,3)]||{nome:'?',penalita:0,desc:''};}
function maxSlots(c){return Math.max(0,Math.max(c.mente,c.anima)-2)}
function hasTalent(c,id){return c.talenti.includes(id)}
function canUseCat(c,cat){const w=G.WCAT[cat];return!w.req||hasTalent(c,w.req)}
function armorData(id){return(G.ARMORS||[])[id]||G.ARMORS[0]}
function shieldData(id){return(G.SHIELDS||[]).find(s=>s.id===id)||G.SHIELDS[0]}
function totalDefBonus(c){return armorData(c.armatura).bonus+shieldData(c.scudo).bonus}
function totalPenMente(c){return armorData(c.armatura).penMente+shieldData(c.scudo).penMente}
function totalPenAnima(c){return armorData(c.armatura).penAnima+shieldData(c.scudo).penAnima}
function movement(c){return armorData(c.armatura).movimento}
function compBonus(c){if(!c.competenza)return 0;const sv=c[c.competenza]||0;return Math.max(1,Math.floor(sv/2));}
function initBonus(c){if(!c.competenza)return 0;return c[c.competenza]+compBonus(c)+(G.WCAT[c.armaCat]?.initMod||0);}
function atkBonus(c){const stat=c.armaMagi?c.mente:c.corpo;const comp=(c.competenza===(c.armaMagi?'mente':'corpo'))?compBonus(c):0;return stat+(G.WCAT[c.armaCat]?.bonus||0)+comp;}
function defCorpo(c){return c.corpo+totalDefBonus(c)}
function displayName(f){return f.replace(/-(classic|core)\.json$/,"").replace(/\.json$/,"").replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());}

/* ═══ CUSTOM COMPENDIO — localStorage ═══ */
function getCustomItems(type){try{return JSON.parse(localStorage.getItem('core_custom_'+type)||'[]');}catch{return[];}}
function pushCustomItem(type,item){
  const arr=getCustomItems(type);
  if(!arr.find(x=>x.id===item.id))arr.push(item);
  localStorage.setItem('core_custom_'+type,JSON.stringify(arr));
  const g=type==='talent'?G.TALENTS:type==='augment'?G.AUGMENTS:G.SPELLS;
  if(g&&!g.find(x=>x.id===item.id))g.push(item);
}
// Merge custom items into globals on startup
;(function initCustomItems(){
  ['talent','augment','spell'].forEach(type=>{
    getCustomItems(type).forEach(item=>{
      const g=type==='talent'?G.TALENTS:type==='augment'?G.AUGMENTS:G.SPELLS;
      if(g&&!g.find(x=>x.id===item.id))g.push(item);
    });
  });
})();

/* ═══ NEW CHAR ═══ */
function newCoreChar(n){return{id:uid(),name:n||"Nuovo PG",system:"core",corpo:4,mente:4,anima:4,hpCurrent:12,competenza:null,armaCat:"B",armaPerk:"b1",armaNome:"",armaDist:false,armaMagi:false,scudo:0,armatura:0,talenti:[],augmenti:[],magie:[],conditions:[],heroPoints:2,perkUses:{},slotUsati:0,notes:"",backstory:""};}

/* ═══ STYLES ═══ */
const SS={
  inp:{background:'var(--s3)',border:'1px solid var(--b1)',borderRadius:6,color:'var(--tx)',fontFamily:'Outfit',fontSize:13,padding:'6px 9px',outline:'none',boxSizing:'border-box'},
  btn:{borderRadius:6,border:'1px solid var(--b2)',background:'none',color:'var(--tx2)',fontFamily:'Outfit',fontSize:12,fontWeight:500,padding:'6px 12px',cursor:'pointer'},
  gold:{borderRadius:6,border:'1.5px solid rgba(232,160,48,0.4)',background:'rgba(232,160,48,0.1)',color:'var(--gold)',fontFamily:'Cinzel',fontWeight:700,fontSize:12,cursor:'pointer',letterSpacing:0.5,textAlign:'center'},
  green:{borderRadius:6,border:'1.5px solid rgba(72,200,138,0.4)',background:'rgba(72,200,138,0.08)',color:'var(--green)',fontFamily:'Cinzel',fontWeight:700,fontSize:12,cursor:'pointer',textAlign:'center'},
  red:{borderRadius:6,border:'1.5px solid rgba(224,80,80,0.3)',background:'rgba(224,80,80,0.08)',color:'var(--red)',fontFamily:'Cinzel',fontWeight:700,fontSize:12,cursor:'pointer',textAlign:'center'},
  card:{background:'var(--s1)',border:'1px solid var(--b1)',borderRadius:10,padding:12,marginBottom:8},
  po:{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.88)',backdropFilter:'blur(8px)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:999,padding:14},
  pc:{background:'linear-gradient(180deg,var(--s1),var(--bg))',border:'1.5px solid rgba(232,160,48,0.3)',borderRadius:12,padding:'18px 16px',width:'100%',maxWidth:440,boxShadow:'0 12px 48px rgba(0,0,0,0.6)'},
};
const TABS=[{id:"sheet",icon:"⚔️",label:"Scheda"},{id:"actions",icon:"🎭",label:"Azioni"},{id:"spells",icon:"📕",label:"Magie"},{id:"dice",icon:"🎲",label:"Dadi"},{id:"notes",icon:"📜",label:"Note"},{id:"save",icon:"💾",label:"Salva"}];

/* ═══════════════════════════════════════════════════════
   APP
═══════════════════════════════════════════════════════ */
function App(){
  const[screen,setScreen]=useState("init");
  const[manifest,setManifest]=useState(null);
  const[accId,setAccId]=useState(null);
  const[ghToken,setGhToken]=useState(null);
  const[char,setChar]=useState(null);
  const[charMeta,setCharMeta]=useState(null);
  const[loading,setLoading]=useState(true);
  const[chars,setChars]=useState([]);
  const[loadingChars,setLoadingChars]=useState(false);
  const[toast,setToast]=useState(null);
  const fileRef=useRef(null);

  const ENC_TOKEN='{"i":[5,170,185,0,120,150,2,170,111,56,153,240],"d":[99,191,61,134,207,114,167,103,79,15,137,76,15,159,247,79,239,75,171,144,32,229,210,227,107,168,22,47,40,79,93,7,150,213,255,74,224,254,20,46,180,100,113,171,93,123,79,39,146,125,6,65,122,52,153,122,191,93,144,66,111,142,124,91,6,54,203,44,91,121,125,158,51,17,116,241,47,74,159,125,139,198,36,6,1,243,121,130,128,78,149,196,79,56,93,105,226,45,151,112,161,86,65,142,181,80,111,155,77]}';
  const decToken=async()=>{try{const h=await H("ttrpg-tk-2026");return await aesDec(ENC_TOKEN,h);}catch{return null;}};

  useEffect(()=>{(async()=>{
    const m=await fetchJ(BASE()+"/data/manifest.json");setManifest(m);
    try{
      const auth=JSON.parse(sessionStorage.getItem("core_auth"));
      if(auth&&auth.accId&&(Date.now()-auth.ts)<3600000){
        setAccId(auth.accId);
        const tk=await decToken();if(tk)setGhToken(tk);
        setScreen("list");setLoading(false);return;
      }
    }catch{}
    setScreen("login");setLoading(false);
  })();},[]);

  const acc=manifest?.accounts?.find(a=>a.id===accId);
  const isMaster=acc?.isMaster||false;
  const up=useCallback(u=>setChar(p=>({...p,...u})),[]);

  const listChars=async(owner)=>{
    const u=new URL(BASE());const user=u.hostname.split(".")[0];const repo=u.pathname.replace(/^\/|\/$/g,"");
    const hd=ghToken?{"Authorization":`token ${ghToken}`,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}:{"Accept":"application/vnd.github+json"};
    try{
      const r=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data/${owner}?t=`+Date.now(),{headers:hd,cache:"no-store"});
      if(!r.ok)return[];const files=await r.json();if(!Array.isArray(files))return[];
      return files.filter(f=>f.name.endsWith("-core.json")&&f.type==="file").map(f=>({file:f.name,name:displayName(f.name)}));
    }catch{return[];}
  };

  const loadAllChars=async()=>{
    setLoadingChars(true);
    const secs=[];
    const own=await listChars(accId);
    if(own.length)secs.push({label:"I Miei PG",owner:accId,chars:own,color:"var(--gold)"});
    if(isMaster){for(const a of(manifest?.accounts?.filter(x=>x.id!==accId)||[])){const ch=await listChars(a.id);if(ch.length)secs.push({label:`PG di ${a.name}`,owner:a.id,chars:ch,color:a.color||"var(--blue)"});}}
    setChars(secs);setLoadingChars(false);
  };

  const loadChar=async(owner,file)=>{
    setLoading(true);const raw=await fetchJ(`${BASE()}/data/${owner}/${file}`);setLoading(false);
    if(!raw)return null;const ch=raw.character||raw;
    if(ch.corpo!==undefined)return ch;return null;
  };

  const saveChar=async(owner,file,charObj)=>{
    if(!ghToken)return false;
    const payload={account:acc?.name,accountId:accId,exportedAt:new Date().toISOString(),character:charObj};
    return await ghPut(`data/${owner}/${file}`,JSON.stringify(payload,null,2),ghToken,accId,isMaster,acc?.name);
  };
  const saveNewChar=async(charObj)=>{
    if(!ghToken||!accId)return null;
    const fname=charObj.name.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")+"-core.json";
    const ok=await ghPut(`data/${accId}/${fname}`,JSON.stringify({account:acc?.name,accountId:accId,exportedAt:new Date().toISOString(),character:charObj},null,2),ghToken,accId,isMaster,acc?.name);
    if(!ok)return null;
    setToast("PG Core creato!");setTimeout(()=>setToast(null),4000);
    return{owner:accId,file:fname};
  };

  useEffect(()=>{if(screen==="list"&&accId&&ghToken)loadAllChars();},[screen,accId,ghToken]);

  return(
    <div style={{height:"var(--app-h)",display:"flex",flexDirection:"column",overflow:"hidden",background:"var(--bg)"}}>
      {loading&&<Loader/>}
      {!loading&&screen==="login"&&<LoginScreen manifest={manifest} onAuth={async(id)=>{setAccId(id);const tk=await decToken();if(tk)setGhToken(tk);setScreen("list");}}/>}
      {!loading&&screen==="list"&&<CharList acc={acc} isMaster={isMaster} chars={chars} loadingChars={loadingChars}
        onBack={()=>{window.location.href=BASE()+"/";}}
        onNew={()=>{setChar(newCoreChar(""));setCharMeta(null);setScreen("sheet");}}
        onLoad={async(owner,file)=>{const c=await loadChar(owner,file);if(c){setChar(c);setCharMeta({owner,file});setScreen("sheet");}else alert("Errore caricamento.");}}
        onManual={()=>setScreen("manual")}
        onCompendium={()=>setScreen("compendium")}
        onHomebrew={()=>setScreen("homebrew")}/>}
      {!loading&&screen==="manual"&&<ManualPage onBack={()=>setScreen("list")}/>}
      {!loading&&screen==="compendium"&&<CompendiumPage onBack={()=>setScreen("list")}/>}
      {!loading&&screen==="homebrew"&&<HomebrewGuide onBack={()=>setScreen("list")}/>}
      {!loading&&screen==="sheet"&&char&&<CoreSheet c={char} up={up} acc={acc} charMeta={charMeta} ghToken={ghToken} isMaster={isMaster} accId={accId} saveChar={saveChar} saveNewChar={saveNewChar} setCharMeta={setCharMeta} onBack={()=>{setChar(null);setCharMeta(null);setScreen("list");}}/>}
      {toast&&<div style={{position:"fixed",bottom:30,left:"50%",transform:"translateX(-50%)",zIndex:100,padding:"10px 20px",borderRadius:8,background:"var(--s1)",border:"1.5px solid rgba(72,200,138,0.4)",color:"var(--green)",fontFamily:"Cinzel",fontSize:12,fontWeight:700,boxShadow:"0 6px 24px rgba(0,0,0,0.5)"}}>✅ {toast}</div>}
    </div>
  );
}

function Loader(){return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"var(--app-h)"}}><div style={{textAlign:"center"}}><div style={{width:40,height:40,border:"3px solid var(--b1)",borderTop:"3px solid var(--gold)",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 16px"}}/><p style={{color:"var(--gold)",fontFamily:"Cinzel",fontSize:14}}>Caricamento...</p></div></div>;}

/* ═══ LOGIN ═══ */
function LoginScreen({manifest,onAuth}){
  const[user,setUser]=useState("");const[pw,setPw]=useState("");const[err,setErr]=useState("");const[show,setShow]=useState(false);
  const accs=manifest?.accounts||[];
  const check=async()=>{
    if(!user.trim()||pw.length<6){setErr("Credenziali non valide");return;}
    const found=accs.find(a=>a.name.toLowerCase()===user.trim().toLowerCase()||a.id===user.trim().toLowerCase());
    if(!found){setErr("Utente non trovato");return;}
    const hashed=await H(pw+"$ttrpg-op-2026$");const dh=await H(hashed);
    if(dh===found.ix)onAuth(found.id);else setErr("Password errata");
  };
  return<div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"var(--app-h)",padding:"0 20px"}}><div style={{textAlign:"center",maxWidth:340,width:"100%"}}>
    <h1 style={{fontFamily:"Cinzel",fontSize:28,fontWeight:900,color:"var(--gold)",marginBottom:4,letterSpacing:3}}>C.O.R.E.</h1>
    <p style={{color:"var(--tx3)",fontSize:11,fontFamily:"JetBrains Mono",marginBottom:30}}>Compact Open Rules Engine</p>
    <input value={user} onChange={e=>setUser(e.target.value)} placeholder="Nome utente..." onKeyDown={e=>e.key==="Enter"&&check()} style={{...SS.inp,width:"100%",fontSize:15,textAlign:"center",padding:"12px",marginBottom:10}}/>
    <div style={{position:"relative",marginBottom:16}}>
      <input type={show?"text":"password"} value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&check()} placeholder="Password..." style={{...SS.inp,width:"100%",fontSize:15,textAlign:"center",padding:"12px 44px 12px 12px"}}/>
      <button onClick={()=>setShow(!show)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"var(--tx3)",fontSize:16,cursor:"pointer"}}>{show?"🙈":"👁"}</button>
    </div>
    {err&&<p style={{color:"var(--red)",fontSize:12,marginBottom:12}}>{err}</p>}
    <button onClick={check} style={{...SS.gold,width:"100%",padding:"12px 0",fontSize:15}}>Entra</button>
    <button onClick={()=>window.location.href=BASE()+"/"} style={{marginTop:16,background:"none",border:"none",color:"var(--tx3)",fontSize:11,cursor:"pointer",fontFamily:"Outfit"}}>← Torna a Classic</button>
  </div></div>;
}

/* ═══ CHAR LIST ═══ */
function CharList({acc,isMaster,chars,loadingChars,onBack,onNew,onLoad,onManual,onCompendium,onHomebrew}){
  if(loadingChars)return<div style={{display:"flex",flexDirection:"column",height:"var(--app-h)"}}>
    <div style={{padding:"14px 18px",borderBottom:"1px solid var(--b1)",background:"var(--s1)",display:"flex",alignItems:"center",gap:10}}>
      <button onClick={onBack} style={{...SS.btn,padding:"6px 10px"}}>←</button>
      <h2 style={{fontFamily:"Cinzel",fontSize:16,color:"var(--gold)",flex:1}}>{acc?.name}</h2>
      <span style={{fontSize:10,color:"var(--gold)",fontFamily:"JetBrains Mono"}}>C.O.R.E.</span>
    </div>
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}><div style={{width:36,height:36,border:"3px solid var(--b1)",borderTop:"3px solid var(--gold)",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 14px"}}/><p style={{color:"var(--gold)",fontFamily:"Cinzel",fontSize:12}}>Caricamento PG...</p></div>
    </div>
  </div>;

  return<div style={{height:"var(--app-h)",display:"flex",flexDirection:"column",overflow:"hidden"}}>
    <div style={{flexShrink:0,padding:"14px 18px",borderBottom:"1px solid var(--b1)",background:"var(--s1)",display:"flex",alignItems:"center",gap:10}}>
      <button onClick={onBack} style={{...SS.btn,padding:"6px 10px"}}>←</button>
      <h2 style={{fontFamily:"Cinzel",fontSize:16,color:"var(--gold)",flex:1}}>{acc?.name}</h2>
      {isMaster&&<span style={{fontSize:9,color:"var(--gold)",opacity:0.6,fontFamily:"Cinzel"}}>👑 Master</span>}
      <span style={{fontSize:10,color:"var(--gold)",fontFamily:"JetBrains Mono",background:"var(--gbg)",padding:"3px 8px",borderRadius:4}}>C.O.R.E.</span>
      <button onClick={()=>window.open(BASE()+"/CoreSystem/core-initiative.html","_blank")} style={{width:32,height:32,borderRadius:"50%",border:"1.5px solid rgba(232,160,48,0.4)",background:"rgba(232,160,48,0.1)",color:"var(--gold)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,cursor:"pointer",flexShrink:0}}>⚔️</button>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:18,paddingBottom:100}}>
      {chars.map((sec,si)=><div key={si} style={{marginBottom:20}}>
        <div style={{borderLeft:`3px solid ${sec.color}`,paddingLeft:8,marginBottom:8}}><span style={{fontFamily:"Cinzel",fontWeight:700,fontSize:11,color:sec.color,letterSpacing:1}}>{sec.label.toUpperCase()}</span></div>
        <div style={{display:"grid",gridTemplateColumns:window.innerWidth>=768?"repeat(2,1fr)":"1fr",gap:8}}>
          {sec.chars.map((gc,i)=><button key={i} onClick={()=>onLoad(sec.owner,gc.file)} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:10,border:"1px solid var(--b1)",background:"var(--s1)",cursor:"pointer",textAlign:"left",width:"100%"}}>
            <div style={{width:36,height:36,borderRadius:8,background:"var(--gbg)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Cinzel",fontWeight:900,fontSize:16,color:"var(--gold)",flexShrink:0}}>{gc.name?gc.name[0]:"?"}</div>
            <span style={{fontFamily:"Cinzel",fontWeight:700,fontSize:14,color:"var(--tx)"}}>{gc.name}</span>
            <span style={{marginLeft:"auto",color:"var(--tx3)",fontSize:14}}>→</span>
          </button>)}
        </div>
      </div>)}
      {chars.length===0&&<p style={{textAlign:"center",color:"var(--tx3)",fontStyle:"italic",padding:"20px 0"}}>Nessun PG Core trovato.</p>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:16}}>
        <button onClick={onNew} style={{...SS.gold,padding:"14px 0",fontSize:13}}>✨ Nuovo PG</button>
        <button onClick={onManual} style={{...SS.btn,padding:"14px 0",fontSize:13,borderColor:"rgba(232,160,48,0.3)",color:"var(--gold)"}}>📖 Manuale</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:8}}>
        <button onClick={onCompendium} style={{...SS.btn,padding:"12px 0",fontSize:12,borderColor:"rgba(160,112,232,0.3)",color:"var(--purple)"}}>📚 Compendio</button>
        <button onClick={onHomebrew} style={{...SS.btn,padding:"12px 0",fontSize:12,borderColor:"rgba(64,200,200,0.3)",color:"var(--cyan)"}}>🔧 Homebrew</button>

}

/* ═══════════════════════════════════════════════════════
   CORE SHEET
═══════════════════════════════════════════════════════ */
function CoreSheet({c,up,acc,charMeta,ghToken,isMaster,accId,saveChar,saveNewChar,setCharMeta,onBack}){
  const[tab,setTab]=useState("sheet");
  const[saving,setSaving]=useState(false);
  const[detail,setDetail]=useState(null);

  const mx=hpMax(c),pct=hpPct(c),tier=woundTier(c),wi=wInfo(tier);
  const hc=pct>0.6?"var(--green)":pct>0.3?"var(--gold)":"var(--red)";

  const doSave=async()=>{
    if(!ghToken)return;setSaving(true);
    let ok;
    if(charMeta){ok=await saveChar(charMeta.owner,charMeta.file,c);}
    else{const res=await saveNewChar(c);ok=!!res;if(res)setCharMeta(res);}
    setSaving(false);
    if(ok)setTimeout(()=>setTab("sheet"),1500);
  };
  useEffect(()=>{if(tab==="save"&&!saving)doSave();},[tab]);

  const NAV=56;

  // wound tier meta
  const tierColor=[null,"var(--gold)","var(--red)","#c03030"][tier]||null;
  const tierLabel=tier===0?"":`${wi.nome.toUpperCase()} ${wi.penalita?`— ${wi.desc}`:"— non agisce, 3 round"}`;

  return(
    <div style={{height:"var(--app-h)",display:"flex",flexDirection:"column",overflow:"hidden",background:"var(--bg)"}}>
      {/* HEADER */}
      <div style={{flexShrink:0,padding:"10px 16px",borderBottom:"1px solid var(--b1)",background:"var(--s1)"}}>
        {/* NAME + BACK */}
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
          <button onClick={()=>{if(confirm("Hai salvato?"))onBack();}} style={{...SS.btn,padding:"4px 8px",fontSize:12}}>←</button>
          <input value={c.name} onChange={e=>up({name:e.target.value})} style={{...SS.inp,flex:1,fontFamily:"Cinzel",fontSize:17,fontWeight:700,color:"var(--gold)",background:"transparent",border:"none",padding:"2px 4px"}}/>
          <span style={{fontSize:9,fontFamily:"JetBrains Mono",color:"var(--gold)",background:"var(--gbg)",padding:"2px 6px",borderRadius:4}}>CORE</span>
        </div>
        {/* STATS + HP */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr) 2fr",gap:6,marginBottom:6}}>
          {[["CORPO","corpo"],["MENTE","mente"],["ANIMA","anima"]].map(([l,k])=>(
            <div key={k} style={{textAlign:"center",background:"var(--s3)",borderRadius:6,padding:"4px",border:"1px solid var(--b1)"}}>
              <div style={{fontSize:9,fontWeight:600,letterSpacing:1,color:"var(--tx3)",textTransform:"uppercase"}}>{l}</div>
              <input type="number" value={c[k]} onChange={e=>{const v=Math.max(1,Math.min(catCap(c),parseInt(e.target.value)||1));up({[k]:v,hpCurrent:Math.min(c.hpCurrent,c.corpo+c.mente+c.anima+(v-c[k])),});}} style={{width:44,background:"none",border:"none",color:"var(--tx)",fontFamily:"JetBrains Mono",fontSize:22,fontWeight:500,textAlign:"center",outline:"none"}}/>
            </div>
          ))}
          {/* HP PANEL */}
          <div style={{background:"var(--s3)",borderRadius:6,padding:"4px 8px",border:`1px solid ${tier>0?tierColor+"44":"var(--b1)"}`,transition:"border-color 0.3s"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:9,fontWeight:600,color:"var(--tx3)"}}>HP {c.hpCurrent}/{mx}</span>
              <span style={{fontSize:10,fontFamily:"JetBrains Mono",fontWeight:700,color:hc}}>{wi.nome}</span>
            </div>
            <div style={{height:6,background:"var(--bg)",borderRadius:3,overflow:"hidden",margin:"4px 0"}}>
              <div style={{height:"100%",borderRadius:3,width:`${pct*100}%`,background:hc,transition:"width 0.3s"}}/>
            </div>
            {/* Wound tier description */}
            {tier>0&&<div style={{fontSize:9,color:tierColor,fontFamily:"Cinzel",fontWeight:700,textAlign:"center",letterSpacing:0.5,marginBottom:3,animation:tier===3?"pulse 1.5s infinite":undefined}}>{tierLabel}</div>}
            <div style={{display:"flex",gap:3}}>
              {[-5,-1,1,5].map(n=><button key={n} onClick={()=>up({hpCurrent:Math.max(0,Math.min(mx,c.hpCurrent+n))})} style={{flex:1,padding:"2px 0",borderRadius:4,border:`1px solid ${n>0?"rgba(72,200,138,0.3)":"rgba(224,80,80,0.3)"}`,background:n>0?"rgba(72,200,138,0.08)":"rgba(224,80,80,0.08)",color:n>0?"var(--green)":"var(--red)",fontSize:11,fontFamily:"JetBrains Mono",fontWeight:600,cursor:"pointer"}}>{n>0?`+${n}`:n}</button>)}
            </div>
          </div>
        </div>
        {/* QUICK STATS */}
        <div style={{display:"flex",gap:4,fontSize:10,fontFamily:"JetBrains Mono",color:"var(--tx3)",alignItems:"center",flexWrap:"wrap"}}>
          <span>ATK +{atkBonus(c)}</span>
          <span>DEF {defCorpo(c)}</span>
          {c.competenza&&<span style={{color:"var(--cyan)"}}>COMP +{compBonus(c)}</span>}
          <span>INIT +{initBonus(c)}</span>
          <span>MOV {movement(c)}m</span>
          <span>SLOT {Math.max(0,maxSlots(c)-(c.slotUsati||0))}/{maxSlots(c)}</span>
          {/* Hero Points */}
          <span style={{marginLeft:"auto",display:"flex",gap:3,alignItems:"center"}}>
            {Array.from({length:3}).map((_,i)=><span key={i} onClick={()=>{const hp=c.heroPoints||0;if(i<hp)up({heroPoints:hp-1});else if(i===hp&&hp<3)up({heroPoints:hp+1});}} style={{fontSize:16,cursor:"pointer",opacity:i<(c.heroPoints||0)?1:0.2}}>⭐</span>)}
            <span style={{fontSize:9,color:"var(--gold)",marginLeft:2}}>PE</span>
          </span>
        </div>
      </div>

      {/* CONTENT — padding bottom generoso per non nascondere nulla sotto le tab */}
      <div style={{flex:1,overflowY:"auto",padding:14,paddingBottom:`calc(${NAV+80}px + var(--safe-bottom))`}}>
        {tab==="sheet"&&<SheetTab c={c} up={up}/>}
        {tab==="actions"&&<ActionsTab c={c} up={up} isMaster={isMaster}/>}
        {tab==="spells"&&<SpellsTab c={c} up={up} isMaster={isMaster}/>}
        {tab==="dice"&&<DiceTab c={c} up={up}/>}
        {tab==="notes"&&<NotesTab c={c} up={up}/>}
        {tab==="save"&&<div style={{textAlign:"center",padding:40,color:"var(--tx3)"}}>{saving?"⏳ Salvataggio...":"✓ Salvato"}</div>}
      </div>

      {/* NAV */}
      <nav style={{position:"fixed",bottom:0,left:0,right:0,display:"flex",background:"rgba(12,12,16,0.98)",borderTop:"1px solid var(--b1)",zIndex:60,paddingBottom:"var(--safe-bottom)"}}>
        {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"8px 0 6px",background:"transparent",border:"none",borderTop:tab===t.id?"2px solid var(--gold)":"2px solid transparent",color:tab===t.id?"var(--gold)":"var(--tx3)",fontFamily:"Outfit",minHeight:NAV,cursor:"pointer"}}>
          <span style={{fontSize:18}}>{t.icon}</span>
          <span style={{fontSize:8,marginTop:3,fontWeight:tab===t.id?600:400}}>{t.label}</span>
        </button>)}
      </nav>

      {detail&&<InfoModal item={detail.item} type={detail.type} onClose={()=>setDetail(null)}/>}
    </div>
  );
}

/* ═══ SHEET TAB ═══ */
function SheetTab({c,up}){
  const perks=G.WPERKS[c.armaCat]||[];
  const activePerk=perks.find(p=>p.id===c.armaPerk);
  return(
    <div style={{animation:"fadeIn 0.15s ease"}}>
      <Sec>Competenza</Sec>
      <div style={{display:"flex",gap:4,marginBottom:6,flexWrap:"wrap",alignItems:"center"}}>
        <Pill on={!c.competenza} onClick={()=>up({competenza:null})}>Nessuna</Pill>
        {["corpo","mente","anima"].map(s=><Pill key={s} on={c.competenza===s} onClick={()=>up({competenza:s})}>{s.toUpperCase()} +{c.competenza===s?compBonus(c):Math.max(1,Math.floor((c[s]||0)/2))}</Pill>)}
      </div>
      {c.competenza&&<div style={{fontSize:11,color:"var(--tx2)",padding:"6px 10px",background:"var(--s3)",borderRadius:6,marginBottom:12,border:"1px solid var(--b1)",fontFamily:"JetBrains Mono"}}>
        {c.competenza.toUpperCase()} {c[c.competenza]} → Bonus +{compBonus(c)} (tutti i tiri con {c.competenza.toUpperCase()})
      </div>}
      <Sec>Arma</Sec>
      <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap",alignItems:"center"}}>
        <input value={c.armaNome} onChange={e=>up({armaNome:e.target.value})} placeholder="Nome arma..." style={{...SS.inp,flex:1,minWidth:120}}/>
        <select value={c.armaCat} onChange={e=>{const v=e.target.value;up({armaCat:v,armaPerk:(G.WPERKS[v]||[])[0]?.id||null});}} style={{...SS.inp,width:140}}>
          {Object.entries(G.WCAT).map(([k,v])=><option key={k} value={k} disabled={!canUseCat(c,k)}>{`Cat ${k} — ${v.nome} +${v.bonus}`}</option>)}
        </select>
      </div>
      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:6}}>
        {perks.map(p=><Pill key={p.id} on={c.armaPerk===p.id} onClick={()=>up({armaPerk:p.id})} title={p.desc}>{p.nome}</Pill>)}
      </div>
      {activePerk&&<div style={{fontSize:11,color:"var(--tx2)",padding:"6px 8px",background:"var(--s3)",borderRadius:6,marginBottom:8,border:"1px solid var(--b1)"}}><em style={{color:"var(--green)"}}>{activePerk.nome}</em> — {activePerk.desc}</div>}
      <div style={{display:"flex",gap:6,marginBottom:12}}>
        <Pill on={c.armaDist} onClick={()=>up({armaDist:!c.armaDist})}>A distanza</Pill>
        <Pill on={c.armaMagi} onClick={()=>up({armaMagi:!c.armaMagi})}>Magica (MENTE)</Pill>
      </div>
      <Sec>Armatura</Sec>
      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:12}}>
        {G.ARMORS.map(a=><Pill key={a.id} on={c.armatura===a.id} onClick={()=>{if(a.req&&c.corpo<a.req){alert(`Richiede CORPO ${a.req}+`);return;}up({armatura:a.id});}} title={a.note}>{`${a.nome} +${a.bonus}`}</Pill>)}
      </div>
      <Sec>Scudo</Sec>
      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:12}}>
        {G.SHIELDS.map(s=>{const blocked=s.rest&&!s.rest.includes(c.armaCat);return<Pill key={s.id} on={c.scudo===s.id} onClick={()=>{if(blocked)return;up({scudo:s.id});}} dim={blocked} title={s.note}>{s.nome}</Pill>;})}
      </div>
      {/* RIEPILOGO */}
      <div style={{...SS.card,fontFamily:"JetBrains Mono",fontSize:11}}>
        {[
          ["⚔ Attacco avg",`1d12+${atkBonus(c)} = ${(6.5+atkBonus(c)).toFixed(1)}`,"var(--gold)"],
          ["🛡 Difesa CORPO",defCorpo(c),"var(--green)"],
          c.competenza&&["🎯 Competenza",`${c.competenza.toUpperCase()} +${compBonus(c)} (stat ${c[c.competenza]})`,"var(--cyan)"],
          ["⚡ Iniziativa",`1d12+${initBonus(c)}`,"var(--cyan)"],
          (totalPenMente(c)||totalPenAnima(c))&&["Penalità",`${totalPenMente(c)?`MENTE -${totalPenMente(c)} `:""}${totalPenAnima(c)?`ANIMA -${totalPenAnima(c)}`:""}`,"var(--red)"],
        ].filter(Boolean).map(([label,val,col],i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"2px 0",borderBottom:"1px solid rgba(255,255,255,0.03)"}}>
            <span style={{color:"var(--tx3)"}}>{label}</span>
            <span style={{color:col}}>{val}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

              {hasPerkUse&&(

                  <span style={{fontSize:9,color:"var(--tx3)",flex:1}}>1x/combat</span>

/* ═══ ADD TO COMPENDIO MODALS (Master only) ═══ */

function AddToCompendioModal({type,onClose,onAdd}){
  const isT=type==="talent";
  const[f,setF]=useState({id:(isT?"t":"a")+"_cust_"+uid(),nome:"",cat:isT?"corpo":"",tipo:!isT?"Biomod":"",stile:"universale",desc:"",pro:"",con:"",perk:"",manutenzione:"",req:""});
  const[addChar,setAddChar]=useState(true);
  const save=()=>{
    if(!f.nome.trim()||!f.desc.trim())return;
    const item={id:f.id,nome:f.nome.trim(),stile:f.stile,desc:f.desc,pro:f.pro||"",con:f.con||"",
      perk:f.perk||null,req:isT?(f.req||null):undefined,
      cat:isT?f.cat:undefined,tipo:!isT?f.tipo:undefined,
      manutenzione:!isT?(f.manutenzione||null):undefined};
    Object.keys(item).forEach(k=>item[k]===undefined&&delete item[k]);
    onAdd(item,addChar);
  };
  return(
    <div style={SS.po} onClick={onClose}>
      <div style={{...SS.pc,maxWidth:420,maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <span style={{fontFamily:"Cinzel",fontSize:13,fontWeight:700,color:"var(--gold)"}}>+ {isT?"Talento":"Miglioramento"} al Compendio</span>

        <CoreField label="Perk (usa '1x/combat:' per uso tracciato)"><input value={f.perk} onChange={e=>setF({...f,perk:e.target.value})} style={{...SS.inp,width:"100%"}} placeholder="es. 1x/combat: ..."/></CoreField>
        {!isT&&<CoreField label="Manutenzione"><input value={f.manutenzione} onChange={e=>setF({...f,manutenzione:e.target.value})} style={{...SS.inp,width:"100%"}} placeholder="opzionale..."/></CoreField>}
        {isT&&<CoreField label="Richiede (ID talento, opzionale)"><input value={f.req} onChange={e=>setF({...f,req:e.target.value})} style={{...SS.inp,width:"100%"}} placeholder="es. gate_mb"/></CoreField>}

/* ═══════════════════════════════════════════════════════
   ACTIONS TAB — redesigned
═══════════════════════════════════════════════════════ */
function ActionsTab({c,up,isMaster}){
  const[custModal,setCustModal]=useState(null); // 'talent' | 'augment' | null

  const allT=G.TALENTS||[];
  const allA=G.AUGMENTS||[];

  const selTalents=c.talenti.map(id=>allT.find(t=>t.id===id)).filter(Boolean);
  const selAugments=c.augmenti.map(id=>allA.find(a=>a.id===id)).filter(Boolean);
  const availT=allT.filter(t=>!c.talenti.includes(t.id));
  const availA=allA.filter(a=>!c.augmenti.includes(a.id));

  // Perk use helpers
  const getPU=id=>c.perkUses?.[id]||0;
  const hasPU=item=>(item.perk||"").includes("1x/");
  const usePerk=id=>up({perkUses:{...(c.perkUses||{}),[id]:getPU(id)+1}});
  const restorePerk=id=>{if(getPU(id)>0)up({perkUses:{...(c.perkUses||{}),[id]:getPU(id)-1}});};

  // Riposo
  const riposo=type=>{
    const u={};
    if(type==="lungo"){
      u.hpCurrent=hpMax(c);u.slotUsati=0;u.heroPoints=2;u.perkUses={};u.conditions=[];
    }else{
      u.hpCurrent=Math.min(hpMax(c),c.hpCurrent+c.corpo);
    }
    up(u);
  };
  const resetCombat=()=>{
    const np={...(c.perkUses||{})};
    [...selTalents,...selAugments].forEach(x=>{if(hasPU(x))np[x.id]=0;});
    up({perkUses:np});
  };

  // Talent category colors
  const catCol={accesso:"var(--gold)",limite:"var(--cyan)",corpo:"var(--red)",mente:"var(--blue)",anima:"var(--purple)",ibrido:"var(--green)"};
  const catLabels={accesso:"⚡ Accessi",limite:"⬆ Limiti",corpo:"CORPO",mente:"MENTE",anima:"ANIMA",ibrido:"Ibrido"};
  const stileIcons={universale:"⬡",fantasy:"⚔",cyberpunk:"◈",noir:"◉",horror:"☽",anime:"⚡","post-ap":"☢"};

  return(
    <div style={{animation:"fadeIn 0.15s ease"}}>
      {/* REST ROW */}
      <div style={{display:"flex",gap:5,marginBottom:12}}>
        <button onClick={()=>riposo("breve")} style={{flex:1,padding:"8px 0",borderRadius:7,border:"1px solid rgba(232,160,48,0.3)",background:"rgba(232,160,48,0.08)",color:"var(--gold)",fontSize:10,fontWeight:700,fontFamily:"Cinzel",cursor:"pointer",lineHeight:1.4}}>☀️ Riposo Breve<br/><span style={{fontSize:8,opacity:0.7,fontWeight:400}}>+CORPO HP</span></button>
        <button onClick={()=>riposo("lungo")} style={{flex:1,padding:"8px 0",borderRadius:7,border:"1px solid rgba(88,144,232,0.3)",background:"rgba(88,144,232,0.08)",color:"var(--blue)",fontSize:10,fontWeight:700,fontFamily:"Cinzel",cursor:"pointer",lineHeight:1.4}}>🌙 Riposo Lungo<br/><span style={{fontSize:8,opacity:0.7,fontWeight:400}}>Tutto ripristinato</span></button>
        <button onClick={resetCombat} title="Resetta usi perk 1x/combat" style={{width:50,borderRadius:7,border:"1px solid var(--b1)",background:"var(--s3)",color:"var(--tx3)",fontSize:11,fontFamily:"Cinzel",cursor:"pointer",lineHeight:1.4}}>⚔️<br/><span style={{fontSize:7}}>reset</span></button>
      </div>

      {/* ─── TALENTI ─── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <Sec>Talenti {c.talenti.length}/5</Sec>
        {isMaster&&<button onClick={()=>setCustModal("talent")} style={{fontSize:9,padding:"3px 9px",borderRadius:4,border:"1px solid var(--b2)",background:"var(--s3)",color:"var(--gold)",cursor:"pointer",fontFamily:"Cinzel",fontWeight:700}}>+ Compendio</button>}
      </div>
      {c.talenti.length<5&&(
        <select onChange={e=>{if(e.target.value&&c.talenti.length<5){up({talenti:[...c.talenti,e.target.value]});e.target.value="";} }} style={{...SS.inp,width:"100%",marginBottom:8,fontSize:11}}>
          <option value="">+ Seleziona talento da aggiungere...</option>
          {["accesso","limite","corpo","mente","anima","ibrido"].map(cat=>{
            const items=availT.filter(t=>t.cat===cat);
            if(!items.length)return null;
            return<optgroup key={cat} label={catLabels[cat]||cat}>
              {items.map(t=><option key={t.id} value={t.id} disabled={!!(t.req&&!hasTalent(c,t.req))}>{t.nome}{t.req&&!hasTalent(c,t.req)?" 🔒":""}</option>)}
            </optgroup>;
          })}
        </select>
      )}
      {selTalents.map(t=>(
        <CoreItemCard key={t.id} item={t} type="talent" color={catCol[t.cat]||"var(--gold)"}
          onRemove={()=>up({talenti:c.talenti.filter(id=>id!==t.id)})}
          perkUses={getPU(t.id)} hasPerkUse={hasPU(t)}
          onUsePerk={()=>usePerk(t.id)} onRestorePerk={()=>restorePerk(t.id)}/>
      ))}
      {c.talenti.length===0&&<p style={{fontSize:11,color:"var(--tx3)",fontStyle:"italic",padding:"6px 0 10px"}}>Nessun talento selezionato.</p>}

      {/* ─── AUGMENTI ─── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,marginTop:14}}>
        <Sec>Miglioramenti {c.augmenti.length}/3</Sec>
        {isMaster&&<button onClick={()=>setCustModal("augment")} style={{fontSize:9,padding:"3px 9px",borderRadius:4,border:"1px solid var(--b2)",background:"var(--s3)",color:"var(--gold)",cursor:"pointer",fontFamily:"Cinzel",fontWeight:700}}>+ Compendio</button>}
      </div>
      {c.augmenti.length>=3&&(
        <div style={{padding:"8px 10px",borderRadius:6,background:"rgba(224,80,80,0.08)",border:"1px solid rgba(224,80,80,0.25)",marginBottom:8,fontSize:11,color:"#e08080",lineHeight:1.5}}>
          ⚠ <strong>Rischio Umanità</strong> — 3 modifiche: -1 ANIMA social. Inizio sessione: ANIMA vs 8.
        </div>
      )}
      {c.augmenti.length<3&&(
        <select onChange={e=>{if(e.target.value&&c.augmenti.length<3){up({augmenti:[...c.augmenti,e.target.value]});e.target.value="";} }} style={{...SS.inp,width:"100%",marginBottom:8,fontSize:11}}>
          <option value="">+ Seleziona miglioramento da aggiungere...</option>
          {Object.keys(G.STILI||{}).map(stile=>{
            const items=availA.filter(a=>a.stile===stile);
            if(!items.length)return null;
            return<optgroup key={stile} label={`${stileIcons[stile]||""} ${(G.STILI[stile]?.lbl)||stile}`}>
              {items.map(a=><option key={a.id} value={a.id}>{a.nome} — {a.tipo}</option>)}
            </optgroup>;
          })}
        </select>
      )}
      {selAugments.map(a=>(
        <CoreItemCard key={a.id} item={a} type="augment" color="var(--red)"
          onRemove={()=>up({augmenti:c.augmenti.filter(id=>id!==a.id)})}
          perkUses={getPU(a.id)} hasPerkUse={hasPU(a)}
          onUsePerk={()=>usePerk(a.id)} onRestorePerk={()=>restorePerk(a.id)}/>
      ))}
      {c.augmenti.length===0&&<p style={{fontSize:11,color:"var(--tx3)",fontStyle:"italic",padding:"6px 0 10px"}}>Nessun miglioramento selezionato.</p>}

      {/* ─── CONDIZIONI ─── */}
      <Sec style={{marginTop:14}}>Condizioni (max 2)</Sec>
      <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
        {(G.CONDITIONS||[]).map(cond=>{
          const active=c.conditions?.find(x=>x.id===cond.id);
          return<Pill key={cond.id} on={!!active} onClick={()=>{
            if(active)up({conditions:(c.conditions||[]).filter(x=>x.id!==cond.id)});
            else{let conds=[...(c.conditions||[]),{id:cond.id,rounds:2}];if(conds.length>2)conds=conds.slice(-2);up({conditions:conds});}
          }} title={cond.effetto}>{cond.nome}</Pill>;
        })}
      </div>

      {/* Custom modals */}
      {custModal&&<AddToCompendioModal type={custModal} onClose={()=>setCustModal(null)}
        onAdd={(item,addChar)=>{
          pushCustomItem(custModal,item);
          if(addChar){if(custModal==="talent"&&c.talenti.length<5)up({talenti:[...c.talenti,item.id]});else if(custModal==="augment"&&c.augmenti.length<3)up({augmenti:[...c.augmenti,item.id]});}
          setCustModal(null);
        }}/>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   SPELLS TAB — redesigned
═══════════════════════════════════════════════════════ */
function SpellsTab({c,up,isMaster}){
  const[spellModal,setSpellModal]=useState(false);

  const ms=maxSlots(c);
  const used=c.slotUsati||0;
  const avail=Math.max(0,ms-used);
  const hasMb=hasTalent(c,"gate_mb");
  const haMa=hasTalent(c,"gate_ma");

  const allSp=G.SPELLS||[];
  const selSpells=c.magie.map(id=>allSp.find(s=>s.id===id)).filter(Boolean);
  const nCt=selSpells.filter(s=>s.tipo==="ct").length;
  const nMg=selSpells.filter(s=>s.tipo==="mg").length;

  const availCt=allSp.filter(s=>s.tipo==="ct"&&!c.magie.includes(s.id));
  const availMg=lvl=>{
    if(lvl<=2&&!hasMb)return[];
    if(lvl>=3&&!haMa)return[];
    return allSp.filter(s=>s.tipo==="mg"&&s.lvl===lvl&&!c.magie.includes(s.id)&&(s.stat==="ANIMA"?c.anima:c.mente)>=s.min);
  };

  const addSpell=id=>{
    const sp=allSp.find(s=>s.id===id);if(!sp)return;
    if(sp.tipo==="ct"&&nCt>=2)return;
    if(sp.tipo==="mg"&&nMg>=ms)return;
    up({magie:[...c.magie,id]});
  };
  const removeSpell=id=>up({magie:c.magie.filter(x=>x!==id)});
  const useSlot=()=>{if(used<ms)up({slotUsati:used+1});};
  const restoreSlot=()=>{if(used>0)up({slotUsati:used-1});};
  const restoreAll=()=>up({slotUsati:0});

  return(
    <div style={{animation:"fadeIn 0.15s ease"}}>

      {/* SLOT TRACKER */}
      {(hasMb||haMa)&&ms>0&&(
        <div style={{background:"var(--s2)",borderRadius:8,padding:"10px 12px",marginBottom:12,border:"1px solid var(--b1)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <span style={{fontFamily:"Cinzel",fontSize:10,fontWeight:700,color:"var(--gold)",letterSpacing:1}}>SLOT MAGIA</span>
            <span style={{fontFamily:"JetBrains Mono",fontSize:13,fontWeight:700,color:avail===0?"var(--red)":"var(--green)"}}>{avail}/{ms}</span>
          </div>
          <div style={{display:"flex",gap:5,marginBottom:8,flexWrap:"wrap"}}>
            {Array.from({length:ms}).map((_,i)=>(
              <div key={i} style={{width:14,height:14,borderRadius:"50%",background:i<used?"var(--b2)":"var(--gold)",border:`1.5px solid ${i<used?"var(--b1)":"var(--gold)"}`,opacity:i<used?0.25:1,transition:"all 0.2s"}}/>
            ))}
          </div>
          <div style={{display:"flex",gap:5}}>
            <button onClick={useSlot} disabled={used>=ms} style={{flex:2,padding:"5px 0",borderRadius:5,border:"1.5px solid rgba(224,80,80,0.3)",background:"rgba(224,80,80,0.08)",color:"var(--red)",fontSize:10,fontFamily:"Cinzel",fontWeight:700,cursor:"pointer",opacity:used>=ms?0.35:1}}>− Usa Slot</button>
            <button onClick={restoreSlot} disabled={used===0} style={{flex:1,padding:"5px 0",borderRadius:5,border:"1px solid var(--b2)",background:"var(--s3)",color:"var(--tx3)",fontSize:12,cursor:"pointer",opacity:used===0?0.35:1}}>↺</button>
            <button onClick={restoreAll} style={{flex:2,padding:"5px 0",borderRadius:5,border:"1.5px solid rgba(72,200,138,0.3)",background:"rgba(72,200,138,0.08)",color:"var(--green)",fontSize:10,fontFamily:"Cinzel",cursor:"pointer"}}>Ripristina tutti</button>
          </div>
        </div>
      )}

      {/* ─── CANTRIP ─── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <Sec>Cantrip {nCt}/2</Sec>
        {isMaster&&<button onClick={()=>setSpellModal(true)} style={{fontSize:9,padding:"3px 9px",borderRadius:4,border:"1px solid var(--b2)",background:"var(--s3)",color:"var(--gold)",cursor:"pointer",fontFamily:"Cinzel",fontWeight:700}}>+ Compendio</button>}
      </div>
      {nCt<2&&(
        <select onChange={e=>{if(e.target.value){addSpell(e.target.value);e.target.value="";}}} style={{...SS.inp,width:"100%",marginBottom:8,fontSize:11}}>
          <option value="">+ Aggiungi cantrip...</option>
          {availCt.map(s=><option key={s.id} value={s.id}>{s.stat==="ANIMA"?"♦":"✦"} {s.nome} ({s.stat})</option>)}
        </select>
      )}
      {selSpells.filter(s=>s.tipo==="ct").map(s=><CoreSpellCard key={s.id} spell={s} onRemove={()=>removeSpell(s.id)}/>)}
      {nCt===0&&<p style={{fontSize:11,color:"var(--tx3)",fontStyle:"italic",padding:"4px 0 10px"}}>Nessun cantrip selezionato.</p>}

      {/* ─── MAGIE PER LIVELLO ─── */}
      {(hasMb||haMa)&&(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,marginTop:12}}>
            <Sec>Magie {nMg}/{ms}</Sec>
          </div>
          {[1,2,3,4].map(lvl=>{
            if(lvl<=2&&!hasMb)return null;
            if(lvl>=3&&!haMa)return null;
            const lvlSpells=selSpells.filter(s=>s.tipo==="mg"&&s.lvl===lvl);
            const av=availMg(lvl);
            const canAdd=nMg<ms;
            return(
              <div key={lvl} style={{marginBottom:10}}>
                <div style={{fontSize:10,color:"var(--tx3)",fontFamily:"JetBrains Mono",marginBottom:5,paddingLeft:2}}>
                  L{lvl} <span style={{color:"var(--gold)"}}>+{lvl-1}</span>
                  {lvl<=2?" (Magia Base)":" (Magia Avanzata)"}
                </div>
                {canAdd&&av.length>0&&(
                  <select onChange={e=>{if(e.target.value){addSpell(e.target.value);e.target.value="";}}} style={{...SS.inp,width:"100%",marginBottom:6,fontSize:10}}>
                    <option value="">+ Aggiungi L{lvl}...</option>
                    {av.map(s=><option key={s.id} value={s.id}>{s.stat==="ANIMA"?"♦":"✦"} {s.nome}</option>)}
                  </select>
                )}
                {lvlSpells.map(s=><CoreSpellCard key={s.id} spell={s} onRemove={()=>removeSpell(s.id)}/>)}
              </div>
            );
          })}
        </>
      )}

      {!hasMb&&!haMa&&(
        <div style={{padding:"16px",borderRadius:8,background:"var(--s2)",border:"1px solid var(--b1)",textAlign:"center",marginTop:8}}>
          <p style={{fontSize:11,color:"var(--tx3)"}}>Seleziona il talento <span style={{color:"var(--gold)",fontFamily:"Cinzel",fontWeight:700}}>Magia Base</span> per accedere alle magie L1-L2.</p>
        </div>
      )}

      {spellModal&&<AddSpellModal onClose={()=>setSpellModal(false)}

/* ═══ COMPENDIUM PAGE ═══ */
function CompendiumPage({onBack}){
  const[tab,setTab]=useState("spells");
  const[search,setSearch]=useState("");
  const[stileF,setStileF]=useState("all");
  const[detail,setDetail]=useState(null);
  const tabs=[{id:"spells",label:"Magie",icon:"📕"},{id:"talents",label:"Talenti",icon:"🎭"},{id:"augments",label:"Modifiche",icon:"⚡"},{id:"weapons",label:"Armi",icon:"⚔️"},{id:"monsters",label:"Mostri",icon:"👹"}];

    </div>
  ));
  let content=[];
  if(tab==="spells"){
    const items=(G.SPELLS||[]).filter(s=>matchStile(s)&&matchSearch(s));

    });
  }else if(tab==="talents"){
    const items=(G.TALENTS||[]).filter(t=>matchStile(t)&&matchSearch(t));
    const cats=["accesso","limite","corpo","mente","anima","ibrido"];
    const labels={accesso:"⚡ Accessi",limite:"⬆ Limiti",corpo:"CORPO",mente:"MENTE",anima:"ANIMA",ibrido:"Ibrido"};
    cats.forEach(cat=>{const ts=items.filter(t=>t.cat===cat);if(!ts.length)return;
      content.push(<div key={cat} style={{fontFamily:"Cinzel",fontSize:12,color:"var(--gold)",margin:"12px 0 6px",letterSpacing:1}}>{labels[cat]||cat}</div>);
      content.push(<div key={cat+"g"} style={{display:"grid",gridTemplateColumns:window.innerWidth>=768?"repeat(2,1fr)":"1fr",gap:6}}>{renderCards(ts,"talent")}</div>);
    });
  }else if(tab==="augments"){
    const items=(G.AUGMENTS||[]).filter(a=>matchStile(a)&&matchSearch(a));
    content.push(<div key="ag" style={{display:"grid",gridTemplateColumns:window.innerWidth>=768?"repeat(2,1fr)":"1fr",gap:6}}>{renderCards(items,"augment")}</div>);
  }else if(tab==="weapons"){
    Object.entries(G.WCAT||{}).forEach(([k,v])=>{
      content.push(<div key={k} style={{fontFamily:"Cinzel",fontSize:12,color:"var(--gold)",margin:"12px 0 6px"}}>{`Cat ${k} — ${v.nome} +${v.bonus}`}</div>);

          <div style={{display:"flex",gap:4}}>
            <span style={{fontSize:10,color:"var(--green)"}}>✔ {p.pro}</span>
            <span style={{fontSize:10,color:"var(--red)"}}>✘ {p.con}</span>
          </div>
        </div>)}
      </div>);
    });
  }else if(tab==="monsters"){
    const items=(G.MONSTERS||[]).filter(m=>matchSearch(m));
    const tiers=["gregario","normale","elite","boss"];
    tiers.forEach(tier=>{const ms=items.filter(m=>m.tier===tier);if(!ms.length)return;
      content.push(<div key={tier} style={{fontFamily:"Cinzel",fontSize:12,color:"var(--gold)",margin:"12px 0 6px",letterSpacing:1,textTransform:"uppercase"}}>{tier}</div>);
      content.push(<div key={tier+"g"} style={{display:"grid",gridTemplateColumns:window.innerWidth>=768?"repeat(2,1fr)":"1fr",gap:6}}>{renderCards(ms,"monster")}</div>);
    });
  }
  return(
    <div style={{height:"var(--app-h)",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{flexShrink:0,padding:"14px 18px",borderBottom:"1px solid var(--b1)",background:"var(--s1)",display:"flex",alignItems:"center",gap:10}}>
        <button onClick={onBack} style={{...SS.btn,padding:"6px 10px"}}>←</button>
        <h2 style={{fontFamily:"Cinzel",fontSize:16,color:"var(--gold)"}}>Compendio</h2>
      </div>
      <div style={{flexShrink:0,padding:"8px 18px",borderBottom:"1px solid var(--b1)",background:"var(--s2)"}}>
        <div style={{display:"flex",gap:4,marginBottom:6,overflowX:"auto"}}>
          {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{...SS.btn,padding:"4px 10px",fontSize:11,borderColor:tab===t.id?"var(--gold)":"var(--b1)",color:tab===t.id?"var(--gold)":"var(--tx3)",background:tab===t.id?"rgba(232,160,48,0.1)":"none",whiteSpace:"nowrap"}}>{t.icon} {t.label}</button>)}
        </div>
        <div style={{display:"flex",gap:6}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cerca..." style={{...SS.inp,flex:1,fontSize:12}}/>
          <select value={stileF} onChange={e=>setStileF(e.target.value)} style={{...SS.inp,width:110,fontSize:11}}>
            <option value="all">Tutti stili</option>
            {Object.entries(G.STILI||{}).map(([k,v])=><option key={k} value={k}>{v.icon+" "+v.lbl}</option>)}
          </select>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"12px 18px 160px"}}>{content}</div>
      {detail&&<InfoModal item={detail.item} type={detail.type} onClose={()=>setDetail(null)}/>}
    </div>
  );
}

      <div style={s.sec}>6. Armi</div>
      <Tbl cols={["Cat","+Attacco","Restrizioni"]} rows={Object.entries(WC).map(([k,v])=>[`Cat ${k}`,`+${v.bonus}`,v.req?(tById(v.req)?.nome||"?")+" richiesto":"—"])}/>
      <div style={s.sec}>7. Armature & Scudi</div>
      <Tbl cols={["Armatura","+Difesa","Penalità","Req"]} rows={AR.map(a=>[a.nome,`+${a.bonus}`,a.penMente?`-${a.penMente} MENTE`:"—",a.req?`CORPO ${a.req}+`:"—"])}/>
      <Tbl cols={["Scudo","+Difesa","Penalità","Restrizioni"]} rows={SH.map(sh=>[sh.nome,`+${sh.bonus}`,sh.penMente?`-${sh.penMente} MENTE`+(sh.penAnima?`, -${sh.penAnima} ANIMA`:""):"—",sh.rest?`Solo Cat ${sh.rest.join("/")}`:sh.id===0?"":"—"])}/>
      <div style={s.sec}>8. Condizioni (max 2)</div>
      <Tbl cols={["Condizione","Effetto","Durata"]} rows={CO.map(c=>[c.nome,c.effetto,c.durata])}/>
      <div style={s.sec}>9. Magie</div>
      <div style={s.formula}>Slot = max(MENTE, ANIMA) - 2</div>
      <Tbl cols={["Livello","+Tiro","Req Stat","Talento"]} rows={[["Cantrip","+0","—","—"],["L1","+0","≥3","Magia Base"],["L2","+1","≥4","Magia Base"],["L3","+2","≥5","Magia Avanzata"],["L4","+3","≥6","Magia Avanzata"]]}/>
      <div style={s.sec}>10. Punto Eroe ⭐</div>
      <p style={s.p}>Ogni PG inizia la sessione con {HP.maxPerSession||2} Punti Eroe.</p>
      <div style={s.box}>{(HP.rules||[]).map((r,i)=><p key={i} style={{margin:"4px 0",fontSize:12}}>→ {r}</p>)}</div>
      <div style={s.sec}>11. Riposi</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
        <div style={s.box}><strong style={{color:"var(--tx)"}}>Riposo Breve</strong> (10 min)<br/>+CORPO HP</div>
        <div style={s.box}><strong style={{color:"var(--tx)"}}>Riposo Lungo</strong> (8 ore)<br/>Tutti HP + slot + Punti Eroe</div>
      </div>
      <div style={s.sec}>12. Progressione</div>
      <Tbl cols={["Avanzamento","Frequenza"]} rows={[["+1 a una stat","Milestone narrativo"],["+1 talento (max 5)","Ogni 3-5 sessioni"],["+1 modifica (max 3)","Milestone o in-world"]]}/>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
