<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const{useState,useEffect,useCallback,useRef}=React;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const BASE=()=>{let b=window.GITHUB_BASE||"";if(b.endsWith("/"))b=b.slice(0,-1);return b;};
async function fetchJ(u){try{const r=await fetch(u+"?t="+Date.now());if(!r.ok)return null;return await r.json();}catch{return null;}}
async function H(s){const e=new TextEncoder().encode(s);const h=await crypto.subtle.digest("SHA-256",e);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");}
function hex2b(h){const b=new Uint8Array(h.length/2);for(let i=0;i<h.length;i+=2)b[i/2]=parseInt(h.substr(i,2),16);return b;}
async function aesDec(stored,passHash){try{const{i,d}=JSON.parse(stored);const k=await crypto.subtle.importKey("raw",hex2b(passHash).slice(0,32),{name:"AES-GCM"},false,["decrypt"]);const dec=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(i)},k,new Uint8Array(d));return new TextDecoder().decode(dec);}catch{return null;}}
async function ghPut(path,content,token,accId,isMaster,accName){
  if(!isMaster&&accId){if(!(path==="data/manifest.json"||path.startsWith("data/"+accId+"/")))return false;}
  const u=new URL(BASE());const user=u.hostname.split(".")[0];const repo=u.pathname.replace(/^\/|\/$/g,"");
  const api="https://api.github.com/repos/"+user+"/"+repo+"/contents/"+path;
  const hd={"Authorization":"token "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  let sha=null;try{const r=await fetch(api+"?t="+Date.now(),{headers:{...hd,"If-None-Match":""},cache:"no-store"});if(r.ok)sha=(await r.json()).sha;}catch{}
  const body={message:"["+(accName||accId||"?")+"] Update "+path,content:btoa(unescape(encodeURIComponent(content)))};
  if(sha)body.sha=sha;
  return(await fetch(api,{method:"PUT",headers:{...hd,"Content-Type":"application/json"},body:JSON.stringify(body)})).ok;
}

/* ═══════════════════════════════════════════
   COSTANTI BILANCIAMENTO  (override core-data.js)
   Armi:  Cat A+1  B+2  C+3  D+4  — illimitate
   Magie: ct+0  L1+2(1pt)  L2+4(2pt)  L3+6(3pt)  L4+8(4pt)
   Stat min: L1≥6  L2≥8  L3≥10  L4≥12
   Cap creazione: max 7/stat al livello 1
═══════════════════════════════════════════ */
const WCAT_BONUS={A:1,B:2,C:3,D:4};
const SPELL_BONUS={ct:0,1:2,2:4,3:6,4:8};
const SPELL_COST={1:1,2:2,3:3,4:4};
const SPELL_MINS={1:6,2:8,3:10,4:12};
const MAX_TALENTI=4;
const MAX_AUGMENTI=2;
const CAP_CREAZIONE=7;

/* ═══ HELPERS ═══ */
const G=window;
function tById(id){return(G.TALENTS||[]).find(t=>t.id===id);}
function talCap(c){return c.talenti.includes("cap_15")?15:c.talenti.includes("cap_12")?12:10;}
function creationCap(c){return((c.level||1)<=1)?CAP_CREAZIONE:talCap(c);}
function hpMax(c){return(c.corpo||0)+(c.mente||0)+(c.anima||0);}
function hpPct(c){const mx=hpMax(c);return mx>0?Math.max(0,Math.min(1,(c.hpCurrent||0)/mx)):0;}
function woundTier(c){
  const mx=hpMax(c),lost=mx-(c.hpCurrent||0),t=Math.floor(mx/3);
  if((c.hpCurrent||0)<=0)return 3;if(lost>=t*2)return 2;if(lost>=t)return 1;return 0;
}
function wInfo(t){return(G.WOUND_TIERS||[])[Math.min(t,3)]||{nome:"?",penalita:0,desc:""};}
function maxSlots(c){return Math.max(0,Math.max(c.mente||0,c.anima||0)-2);}
function hasTalent(c,id){return(c.talenti||[]).includes(id);}
function intuizioneMagica(c){return(c.mente||0)>=10;}
function armorData(c){return(G.ARMORS||[])[c.armatura||(c.armatura===0?0:0)]||(G.ARMORS||[])[0]||{bonus:0,penMente:0,penAnima:0,movimento:9};}
function shieldData(c){return(G.SHIELDS||[]).find(s=>s.id===c.scudo)||(G.SHIELDS||[])[0]||{bonus:0,penMente:0,penAnima:0};}
function totalDefBonus(c){return armorData(c).bonus+shieldData(c).bonus;}
function totalPenMente(c){return armorData(c).penMente+shieldData(c).penMente;}
function totalPenAnima(c){return armorData(c).penAnima+shieldData(c).penAnima;}
function movement(c){return armorData(c).movimento||9;}
function compBonus(c){if(!c.competenza)return 0;const sv=c[c.competenza]||0;return Math.max(1,Math.floor(sv/2));}
function initBonus(c){if(!c.competenza)return 0;return(c[c.competenza]||0)+compBonus(c)+((G.WCAT||{})[c.armaCat]?.initMod||0);}
function atkBonus(c){
  const stat=c.armaMagi?(c.mente||0):(c.corpo||0);
  const wB=WCAT_BONUS[c.armaCat]||((G.WCAT||{})[c.armaCat]?.bonus||0);
  const comp=(c.competenza===(c.armaMagi?"mente":"corpo"))?compBonus(c):0;
  return stat+wB+comp;
}
function defCorpo(c){return(c.corpo||0)+totalDefBonus(c);}
function spellBonus(sp){return sp.tipo==="ct"?0:(SPELL_BONUS[sp.lvl]||0);}
function spellCost(sp){return sp.tipo==="ct"?0:(SPELL_COST[sp.lvl]||1);}
function spellMinStat(sp){return sp.tipo==="ct"?0:(SPELL_MINS[sp.lvl]||3);}
function statPen(v){return v<=0?-2:v<=2?-1:0;}
function condPenalty(c){return((c.conditions||[]).length>=3)?-2:0;}
function canUseCat(c,cat){
  if(cat==="A"||cat==="B")return true;
  if(cat==="C")return(c.corpo||0)>=6||hasTalent(c,"armi_pesanti");
  if(cat==="D")return(c.corpo||0)>=10&&hasTalent(c,"armi_letali");
  return!((G.WCAT||{})[cat]?.req)||hasTalent(c,(G.WCAT||{})[cat]?.req);
}
function canLearnSpell(c,sp){
  if(sp.tipo==="ct")return true;
  const lvl=sp.lvl;
  const statVal=(sp.stat==="ANIMA"?(c.anima||0):(c.mente||0));
  if(statVal<(SPELL_MINS[lvl]||3))return false;
  if(lvl<=2)return hasTalent(c,"gate_mb")||intuizioneMagica(c);
  return hasTalent(c,"gate_ma");
}
function displayName(f){return f.replace(/-(classic|core)\.json$/,"").replace(/\.json$/,"").replace(/_/g," ").replace(/\b\w/g,x=>x.toUpperCase());}

/* ═══ CUSTOM COMPENDIO localStorage ═══ */
function getCustomItems(type){try{return JSON.parse(localStorage.getItem("core_custom_"+type)||"[]");}catch{return[];}}
function pushCustomItem(type,item){
  const arr=getCustomItems(type);if(!arr.find(x=>x.id===item.id))arr.push(item);
  localStorage.setItem("core_custom_"+type,JSON.stringify(arr));
  const g=type==="talent"?G.TALENTS:type==="augment"?G.AUGMENTS:G.SPELLS;
  if(g&&!g.find(x=>x.id===item.id))g.push(item);
}
;(function initCustomItems(){
  ["talent","augment","spell"].forEach(type=>{
    getCustomItems(type).forEach(item=>{
      const g=type==="talent"?G.TALENTS:type==="augment"?G.AUGMENTS:G.SPELLS;
      if(g&&!g.find(x=>x.id===item.id))g.push(item);
    });
  });
})();

function newCoreChar(n){return{
  id:uid(),name:n||"Nuovo PG",system:"core",level:1,
  corpo:4,mente:4,anima:4,hpCurrent:12,
  competenza:null,armaCat:"B",armaPerk:"b1",armaNome:"",armaDist:false,armaMagi:false,
  scudo:0,armatura:0,talenti:[],augmenti:[],magie:[],conditions:[],heroPoints:2,
  perkUses:{},slotUsati:0,notes:"",backstory:""
};}

const SS={
  inp:{background:"var(--s3)",border:"1px solid var(--b1)",borderRadius:6,color:"var(--tx)",fontFamily:"Outfit",fontSize:13,padding:"6px 9px",outline:"none",boxSizing:"border-box"},
  btn:{borderRadius:6,border:"1px solid var(--b2)",background:"none",color:"var(--tx2)",fontFamily:"Outfit",fontSize:12,fontWeight:500,padding:"6px 12px",cursor:"pointer"},
  gold:{borderRadius:6,border:"1.5px solid rgba(232,160,48,0.4)",background:"rgba(232,160,48,0.1)",color:"var(--gold)",fontFamily:"Cinzel",fontWeight:700,fontSize:12,cursor:"pointer",letterSpacing:0.5,textAlign:"center"},
  green:{borderRadius:6,border:"1.5px solid rgba(72,200,138,0.4)",background:"rgba(72,200,138,0.08)",color:"var(--green)",fontFamily:"Cinzel",fontWeight:700,fontSize:12,cursor:"pointer",textAlign:"center"},
  card:{background:"var(--s1)",border:"1px solid var(--b1)",borderRadius:10,padding:12,marginBottom:8},
  po:{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.88)",backdropFilter:"blur(8px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:14},
  pc:{background:"linear-gradient(180deg,var(--s1),var(--bg))",border:"1.5px solid rgba(232,160,48,0.3)",borderRadius:12,padding:"18px 16px",width:"100%",maxWidth:440,boxShadow:"0 12px 48px rgba(0,0,0,0.6)"},
};
const TABS=[
  {id:"sheet",icon:"\u2694\ufe0f",label:"Scheda"},
  {id:"actions",icon:"\ud83c\udfad",label:"Azioni"},
  {id:"spells",icon:"\ud83d\udcd5",label:"Magie"},
  {id:"dice",icon:"\ud83c\udfb2",label:"Dadi"},
  {id:"notes",icon:"\ud83d\udcdc",label:"Note"},
  {id:"save",icon:"\ud83d\udcbe",label:"Salva"}
];

/* ══════════════ APP ══════════════ */
function App(){
  const[screen,setScreen]=useState("init");const[manifest,setManifest]=useState(null);
  const[accId,setAccId]=useState(null);const[ghToken,setGhToken]=useState(null);
  const[char,setChar]=useState(null);const[charMeta,setCharMeta]=useState(null);
  const[loading,setLoading]=useState(true);const[chars,setChars]=useState([]);
  const[loadingChars,setLoadingChars]=useState(false);const[toast,setToast]=useState(null);

  const ENC='{"i":[5,170,185,0,120,150,2,170,111,56,153,240],"d":[99,191,61,134,207,114,167,103,79,15,137,76,15,159,247,79,239,75,171,144,32,229,210,227,107,168,22,47,40,79,93,7,150,213,255,74,224,254,20,46,180,100,113,171,93,123,79,39,146,125,6,65,122,52,153,122,191,93,144,66,111,142,124,91,6,54,203,44,91,121,125,158,51,17,116,241,47,74,159,125,139,198,36,6,1,243,121,130,128,78,149,196,79,56,93,105,226,45,151,112,161,86,65,142,181,80,111,155,77]}';
  const decTk=async()=>{try{const h=await H("ttrpg-tk-2026");return await aesDec(ENC,h);}catch{return null;}};

  useEffect(()=>{(async()=>{
    const m=await fetchJ(BASE()+"/data/manifest.json");setManifest(m);
    try{const a=JSON.parse(sessionStorage.getItem("core_auth"));if(a&&a.accId&&Date.now()-a.ts<3600000){setAccId(a.accId);const tk=await decTk();if(tk)setGhToken(tk);setScreen("list");setLoading(false);return;}}catch{}
    setScreen("login");setLoading(false);
  })();},[]);

  const acc=manifest?.accounts?.find(a=>a.id===accId);
  const isMaster=acc?.isMaster||false;
  const up=useCallback(u=>setChar(p=>({...p,...u})),[]);

  const listChars=async(owner)=>{
    const u=new URL(BASE());const user=u.hostname.split(".")[0];const repo=u.pathname.replace(/^\/|\/$/g,"");
    const hd=ghToken?{"Authorization":"token "+ghToken,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}:{"Accept":"application/vnd.github+json"};
    try{const r=await fetch("https://api.github.com/repos/"+user+"/"+repo+"/contents/data/"+owner+"?t="+Date.now(),{headers:hd,cache:"no-store"});if(!r.ok)return[];const f=await r.json();if(!Array.isArray(f))return[];return f.filter(f=>f.name.endsWith("-core.json")&&f.type==="file").map(f=>({file:f.name,name:displayName(f.name)}));}catch{return[];}
  };
  const loadAllChars=async()=>{
    setLoadingChars(true);const secs=[];
    const own=await listChars(accId);if(own.length)secs.push({label:"I Miei PG",owner:accId,chars:own,color:"var(--gold)"});
    if(isMaster)for(const a of(manifest?.accounts?.filter(x=>x.id!==accId)||[])){const ch=await listChars(a.id);if(ch.length)secs.push({label:"PG di "+a.name,owner:a.id,chars:ch,color:a.color||"var(--blue)"});}
    setChars(secs);setLoadingChars(false);
  };
  const loadChar=async(owner,file)=>{
    setLoading(true);const raw=await fetchJ(BASE()+"/data/"+owner+"/"+file);setLoading(false);
    if(!raw)return null;const ch=raw.character||raw;
    if(ch.corpo!==undefined){if(!ch.level)ch.level=1;if(!ch.perkUses)ch.perkUses={};if(ch.slotUsati===undefined)ch.slotUsati=0;return ch;}return null;
  };
  const saveChar=async(owner,file,charObj)=>{if(!ghToken)return false;return await ghPut("data/"+owner+"/"+file,JSON.stringify({account:acc?.name,accountId:accId,exportedAt:new Date().toISOString(),character:charObj},null,2),ghToken,accId,isMaster,acc?.name);};
  const saveNewChar=async(charObj)=>{
    if(!ghToken||!accId)return null;
    const fname=charObj.name.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")+"-core.json";
    const ok=await ghPut("data/"+accId+"/"+fname,JSON.stringify({account:acc?.name,accountId:accId,exportedAt:new Date().toISOString(),character:charObj},null,2),ghToken,accId,isMaster,acc?.name);
    if(!ok)return null;setToast("PG Core creato!");setTimeout(()=>setToast(null),4000);return{owner:accId,file:fname};
  };
  useEffect(()=>{if(screen==="list"&&accId&&ghToken)loadAllChars();},[screen,accId,ghToken]);

  return<div style={{height:"var(--app-h)",display:"flex",flexDirection:"column",overflow:"hidden",background:"var(--bg)"}}>
    {loading&&<Loader/>}
    {!loading&&screen==="login"&&<LoginScreen manifest={manifest} onAuth={async(id)=>{setAccId(id);const tk=await decTk();if(tk)setGhToken(tk);setScreen("list");}}/>}
    {!loading&&screen==="list"&&<CharList acc={acc} isMaster={isMaster} chars={chars} loadingChars={loadingChars}
      onBack={()=>{window.location.href=BASE()+"/";}} onNew={()=>{setChar(newCoreChar(""));setCharMeta(null);setScreen("sheet");}}
      onLoad={async(owner,file)=>{const c=await loadChar(owner,file);if(c){setChar(c);setCharMeta({owner,file});setScreen("sheet");}else alert("Errore caricamento.");}}
      onManual={()=>setScreen("manual")} onCompendium={()=>setScreen("compendium")} onHomebrew={()=>setScreen("homebrew")}/>}
    {!loading&&screen==="manual"&&<ManualPage onBack={()=>setScreen("list")}/>}
    {!loading&&screen==="compendium"&&<CompendiumPage onBack={()=>setScreen("list")}/>}
    {!loading&&screen==="homebrew"&&<HomebrewGuide onBack={()=>setScreen("list")}/>}
    {!loading&&screen==="sheet"&&char&&<CoreSheet c={char} up={up} acc={acc} charMeta={charMeta} ghToken={ghToken} isMaster={isMaster} accId={accId} saveChar={saveChar} saveNewChar={saveNewChar} setCharMeta={setCharMeta} onBack={()=>{setChar(null);setCharMeta(null);setScreen("list");}}/>}
    {toast&&<div style={{position:"fixed",bottom:30,left:"50%",transform:"translateX(-50%)",zIndex:100,padding:"10px 20px",borderRadius:8,background:"var(--s1)",border:"1.5px solid rgba(72,200,138,0.4)",color:"var(--green)",fontFamily:"Cinzel",fontSize:12,fontWeight:700}}>{toast}</div>}
  </div>;
}

function Loader(){return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"var(--app-h)"}}><div style={{textAlign:"center"}}><div style={{width:40,height:40,border:"3px solid var(--b1)",borderTop:"3px solid var(--gold)",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 16px"}}/><p style={{color:"var(--gold)",fontFamily:"Cinzel",fontSize:14}}>Caricamento...</p></div></div>;}

function LoginScreen({manifest,onAuth}){
  const[user,setUser]=useState("");const[pw,setPw]=useState("");const[err,setErr]=useState("");const[show,setShow]=useState(false);
  const accs=manifest?.accounts||[];
  const check=async()=>{
    if(!user.trim()||pw.length<6){setErr("Credenziali non valide");return;}
    const found=accs.find(a=>a.name.toLowerCase()===user.trim().toLowerCase()||a.id===user.trim().toLowerCase());
    if(!found){setErr("Utente non trovato");return;}
    const hashed=await H(pw+"$ttrpg-op-2026$");const dh=await H(hashed);
    if(dh===found.ix)onAuth(found.id);else setErr("Password errata");
  };
  return<div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"var(--app-h)",padding:"0 20px"}}>
    <div style={{textAlign:"center",maxWidth:340,width:"100%"}}>
      <h1 style={{fontFamily:"Cinzel",fontSize:28,fontWeight:900,color:"var(--gold)",marginBottom:4,letterSpacing:3}}>C.O.R.E.</h1>
      <p style={{color:"var(--tx3)",fontSize:11,fontFamily:"JetBrains Mono",marginBottom:30}}>Compact Open Rules Engine</p>
      <input value={user} onChange={e=>setUser(e.target.value)} placeholder="Nome utente..." onKeyDown={e=>e.key==="Enter"&&check()} style={{...SS.inp,width:"100%",fontSize:15,textAlign:"center",padding:"12px",marginBottom:10}}/>
      <div style={{position:"relative",marginBottom:16}}>
        <input type={show?"text":"password"} value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&check()} placeholder="Password..." style={{...SS.inp,width:"100%",fontSize:15,textAlign:"center",padding:"12px 44px 12px 12px"}}/>
        <button onClick={()=>setShow(!show)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"var(--tx3)",fontSize:16,cursor:"pointer"}}>{show?"\ud83d\ude48":"\ud83d\udc41"}</button>
      </div>
      {err&&<p style={{color:"var(--red)",fontSize:12,marginBottom:12}}>{err}</p>}
      <button onClick={check} style={{...SS.gold,width:"100%",padding:"12px 0",fontSize:15}}>Entra</button>
      <button onClick={()=>window.location.href=BASE()+"/"} style={{marginTop:16,background:"none",border:"none",color:"var(--tx3)",fontSize:11,cursor:"pointer",fontFamily:"Outfit"}}>{"\u2190"} Torna a Classic</button>
    </div>
  </div>;
}

function CharList({acc,isMaster,chars,loadingChars,onBack,onNew,onLoad,onManual,onCompendium,onHomebrew}){
  const hdr=<div style={{flexShrink:0,padding:"14px 18px",borderBottom:"1px solid var(--b1)",background:"var(--s1)",display:"flex",alignItems:"center",gap:10}}>
    <button onClick={onBack} style={{...SS.btn,padding:"6px 10px"}}>{"\u2190"}</button>
    <h2 style={{fontFamily:"Cinzel",fontSize:16,color:"var(--gold)",flex:1}}>{acc?.name}</h2>
    {isMaster&&<span style={{fontSize:9,color:"var(--gold)",opacity:0.6,fontFamily:"Cinzel"}}>Master</span>}
    <span style={{fontSize:10,color:"var(--gold)",fontFamily:"JetBrains Mono",background:"var(--gbg)",padding:"3px 8px",borderRadius:4}}>C.O.R.E.</span>
    <button onClick={()=>window.open(BASE()+"/CoreSystem/core-initiative.html","_blank")} style={{width:32,height:32,borderRadius:"50%",border:"1.5px solid rgba(232,160,48,0.4)",background:"rgba(232,160,48,0.1)",color:"var(--gold)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,cursor:"pointer",flexShrink:0}}>{"\u2694\ufe0f"}</button>
  </div>;

/* ══════════════ CORE SHEET ══════════════ */
function CoreSheet({c,up,acc,charMeta,ghToken,isMaster,accId,saveChar,saveNewChar,setCharMeta,onBack}){
  const[tab,setTab]=useState("sheet");const[saving,setSaving]=useState(false);
  const mx=hpMax(c),pct=hpPct(c),tier=woundTier(c),wi=wInfo(tier);
  const hc=pct>0.6?"var(--green)":pct>0.3?"var(--gold)":"var(--red)";
  const tierColor=[null,"var(--gold)","var(--red)","#c03030"][tier]||null;
  const cond=condPenalty(c);
  const slots=maxSlots(c);const slotsLeft=Math.max(0,slots-(c.slotUsati||0));

  const doSave=async()=>{
    if(!ghToken)return;setSaving(true);let ok;
    if(charMeta)ok=await saveChar(charMeta.owner,charMeta.file,c);
    else{const res=await saveNewChar(c);ok=!!res;if(res)setCharMeta(res);}
    setSaving(false);if(ok)setTimeout(()=>setTab("sheet"),1500);
  };
  useEffect(()=>{if(tab==="save"&&!saving)doSave();},[tab]);
  const NAV=56;

  return<div style={{height:"var(--app-h)",display:"flex",flexDirection:"column",overflow:"hidden",background:"var(--bg)"}}>
    <div style={{flexShrink:0,padding:"10px 16px",borderBottom:"1px solid var(--b1)",background:"var(--s1)"}}>
      {/* Nome + livello */}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
        <button onClick={()=>{if(confirm("Hai salvato?"))onBack();}} style={{...SS.btn,padding:"4px 8px",fontSize:12}}>{"\u2190"}</button>
        <input value={c.name} onChange={e=>up({name:e.target.value})} style={{...SS.inp,flex:1,fontFamily:"Cinzel",fontSize:17,fontWeight:700,color:"var(--gold)",background:"transparent",border:"none",padding:"2px 4px"}}/>
        <div style={{display:"flex",alignItems:"center",gap:3}}>
          <span style={{fontSize:9,color:"var(--tx3)"}}>Lv</span>
          <input type="number" value={c.level||1} onChange={e=>up({level:Math.max(1,Math.min(15,parseInt(e.target.value)||1))})} style={{...SS.inp,width:36,textAlign:"center",fontSize:13,fontWeight:700,color:"var(--gold)",padding:"3px"}} min="1" max="15"/>
        </div>
        <span style={{fontSize:9,fontFamily:"JetBrains Mono",color:"var(--gold)",background:"var(--gbg)",padding:"2px 6px",borderRadius:4}}>CORE</span>
      </div>
      {/* Stat + HP */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr) 2fr",gap:6,marginBottom:6}}>
        {[["CORPO","corpo"],["MENTE","mente"],["ANIMA","anima"]].map(([l,k])=>{
          const val=c[k]||0;const cap=creationCap(c);const pen=statPen(val);
          return<div key={k} style={{textAlign:"center",background:"var(--s3)",borderRadius:6,padding:"4px",border:"1px solid "+(pen<0?"rgba(224,80,80,0.5)":"var(--b1)"),transition:"border-color 0.2s"}}>
            <div style={{fontSize:9,fontWeight:600,letterSpacing:1,color:"var(--tx3)",textTransform:"uppercase"}}>{l}</div>
            <input type="number" value={val} onChange={e=>{const nv=Math.max(1,Math.min(cap,parseInt(e.target.value)||1));up({[k]:nv,hpCurrent:Math.min(c.hpCurrent,hpMax(c)+(nv-val))});}} style={{width:44,background:"none",border:"none",color:pen<0?"var(--red)":"var(--tx)",fontFamily:"JetBrains Mono",fontSize:22,fontWeight:500,textAlign:"center",outline:"none"}} min="1" max={cap}/>
            {pen<0&&<div style={{fontSize:8,color:"var(--red)",fontFamily:"JetBrains Mono",lineHeight:1}}>{pen}</div>}
          </div>;
        })}
        {/* HP panel */}
        <div style={{background:"var(--s3)",borderRadius:6,padding:"4px 8px",border:"1px solid "+(tier>0?tierColor+"44":"var(--b1)"),transition:"border-color 0.3s"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:9,fontWeight:600,color:"var(--tx3)"}}>HP {c.hpCurrent}/{mx}</span>
            <span style={{fontSize:10,fontFamily:"JetBrains Mono",fontWeight:700,color:hc}}>{wi.nome}</span>
          </div>
          <div style={{height:6,background:"var(--bg)",borderRadius:3,overflow:"hidden",margin:"4px 0"}}>
            <div style={{height:"100%",borderRadius:3,width:(pct*100)+"%",background:hc,transition:"width 0.3s"}}/>
          </div>
          {tier>0&&<div style={{fontSize:9,color:tierColor,fontFamily:"Cinzel",fontWeight:700,textAlign:"center",letterSpacing:0.5,marginBottom:3,animation:tier===3?"pulse 1.5s infinite":undefined}}>{wi.nome.toUpperCase()}{wi.penalita?" — "+wi.desc:" — non agisce, 3 round"}</div>}
          <div style={{display:"flex",gap:3}}>
            {[-5,-1,1,5].map(n=><button key={n} onClick={()=>up({hpCurrent:Math.max(0,Math.min(mx,(c.hpCurrent||0)+n))})} style={{flex:1,padding:"2px 0",borderRadius:4,border:"1px solid "+(n>0?"rgba(72,200,138,0.3)":"rgba(224,80,80,0.3)"),background:n>0?"rgba(72,200,138,0.08)":"rgba(224,80,80,0.08)",color:n>0?"var(--green)":"var(--red)",fontSize:11,fontFamily:"JetBrains Mono",fontWeight:600,cursor:"pointer"}}>{n>0?"+"+n:n}</button>)}
          </div>
        </div>
      </div>
      {/* Quick stats row */}
      <div style={{display:"flex",gap:4,fontSize:10,fontFamily:"JetBrains Mono",color:"var(--tx3)",alignItems:"center",flexWrap:"wrap"}}>
        <span>ATK +{atkBonus(c)+cond}</span>
        <span>DEF {defCorpo(c)}</span>
        {c.competenza&&<span style={{color:"var(--cyan)"}}>COMP +{compBonus(c)}</span>}
        <span>INIT +{initBonus(c)+cond}</span>
        <span>MOV {movement(c)}m</span>
        <span style={{color:slotsLeft===0&&slots>0?"var(--red)":slots>0?"var(--purple)":"var(--tx3)"}}>SLOT {slotsLeft}/{slots}pt</span>
        {cond!==0&&<span style={{color:"var(--red)",fontWeight:700}}>{"\u26a0"}{cond} cond</span>}
        <span style={{marginLeft:"auto",display:"flex",gap:3,alignItems:"center"}}>
          {Array.from({length:3}).map((_,i)=><span key={i} onClick={()=>{const hp=c.heroPoints||0;if(i<hp)up({heroPoints:hp-1});else if(i===hp&&hp<3)up({heroPoints:hp+1});}} style={{fontSize:16,cursor:"pointer",opacity:i<(c.heroPoints||0)?1:0.2}}>{"\u2b50"}</span>)}
          <span style={{fontSize:9,color:"var(--gold)",marginLeft:2}}>PE</span>
        </span>
      </div>
      {(c.level||1)<=1&&<div style={{fontSize:9,color:"var(--tx3)",textAlign:"center",marginTop:3,fontFamily:"JetBrains Mono"}}>Creazione Lv1: max {CAP_CREAZIONE}/stat · 12 punti totali</div>}
    </div>

    <div style={{flex:1,overflowY:"auto",padding:14,paddingBottom:"calc("+(NAV+80)+"px + var(--safe-bottom))"}}>
      {tab==="sheet"&&<SheetTab c={c} up={up}/>}
      {tab==="actions"&&<ActionsTab c={c} up={up} isMaster={isMaster}/>}
      {tab==="spells"&&<SpellsTab c={c} up={up} isMaster={isMaster}/>}
      {tab==="dice"&&<DiceTab c={c} up={up}/>}
      {tab==="notes"&&<NotesTab c={c} up={up}/>}
      {tab==="save"&&<div style={{textAlign:"center",padding:40,color:"var(--tx3)"}}>{saving?"\u23f3 Salvataggio...":"\u2713 Salvato"}</div>}
    </div>

    <nav style={{position:"fixed",bottom:0,left:0,right:0,display:"flex",background:"rgba(12,12,16,0.98)",borderTop:"1px solid var(--b1)",zIndex:60,paddingBottom:"var(--safe-bottom)"}}>
      {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"8px 0 6px",background:"transparent",border:"none",borderTop:tab===t.id?"2px solid var(--gold)":"2px solid transparent",color:tab===t.id?"var(--gold)":"var(--tx3)",fontFamily:"Outfit",minHeight:NAV,cursor:"pointer"}}>
        <span style={{fontSize:18}}>{t.icon}</span>
        <span style={{fontSize:8,marginTop:3,fontWeight:tab===t.id?600:400}}>{t.label}</span>
      </button>)}
    </nav>
  </div>;
}

/* ═══ ATOMS ═══ */
function Sec({children,style:extra}){return<h3 style={{fontFamily:"Cinzel",fontSize:11,fontWeight:700,color:"var(--gold)",letterSpacing:2,textTransform:"uppercase",margin:"14px 0 8px",...extra}}>{children}</h3>;}
function Pill({on,dim,color,onClick,title,children}){const c=color||"var(--gold)";return<span onClick={dim?null:onClick} title={title} style={{fontSize:11,padding:"4px 10px",borderRadius:20,cursor:dim?"default":"pointer",border:"1px solid "+(on?c:"var(--b1)"),background:on?c+"18":"var(--s3)",color:on?c:"var(--tx2)",opacity:dim?0.22:1,transition:"all 0.15s",userSelect:"none"}}>{children}</span>;}
function CoreField({label,children}){return<div style={{marginBottom:8}}><label style={{display:"block",fontSize:9,fontWeight:600,color:"var(--tx3)",letterSpacing:1,textTransform:"uppercase",marginBottom:3,fontFamily:"Cinzel"}}>{label}</label>{children}</div>;}

      <select value={c.armaCat} onChange={e=>{const v=e.target.value;up({armaCat:v,armaPerk:((G.WPERKS||{})[v]||[])[0]?.id||null});}} style={{...SS.inp,width:165}}>
        {Object.entries(G.WCAT||{}).map(([k,v])=>{const av=canUseCat(c,k);return<option key={k} value={k} disabled={!av}>{"Cat "+k+" +"+(WCAT_BONUS[k]||v.bonus)+" — "+v.nome+(av?"":"  \ud83d\udd12")}</option>;})}

    </div>
    <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:6}}>{perks.map(p=><Pill key={p.id} on={c.armaPerk===p.id} onClick={()=>up({armaPerk:p.id})} title={p.desc}>{p.nome}</Pill>)}</div>
    {ap&&<div style={{fontSize:11,color:"var(--tx2)",padding:"6px 8px",background:"var(--s3)",borderRadius:6,marginBottom:8,border:"1px solid var(--b1)"}}><em style={{color:"var(--green)"}}>{ap.nome}</em> — {ap.desc}</div>}
    <div style={{display:"flex",gap:6,marginBottom:12}}>

    <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:12}}>
      {(G.ARMORS||[]).map(a=><Pill key={a.id} on={c.armatura===a.id} onClick={()=>{if(a.req&&(c.corpo||0)<a.req){alert("Richiede CORPO "+a.req+"+");return;}up({armatura:a.id});}} title={a.note}>{a.nome+" +"+a.bonus}</Pill>)}
    </div>
    <Sec>Scudo</Sec>
    <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:12}}>
      {(G.SHIELDS||[]).map(s=>{const bl=s.rest&&!s.rest.includes(c.armaCat);return<Pill key={s.id} on={c.scudo===s.id} onClick={()=>{if(bl)return;up({scudo:s.id});}} dim={bl} title={s.note}>{s.nome}</Pill>;})}

      <div style={{fontFamily:"Cinzel",fontSize:10,color:"var(--gold)",letterSpacing:1,marginBottom:8}}>RIEPILOGO</div>
      {[
        ["\u2694 Cat "+c.armaCat+" — Attacco","1d12+"+atkBonus(c)+" = "+(6.5+atkBonus(c)).toFixed(1)+" avg, ILLIMITATO","var(--gold)"],
        ["\ud83d\udee1 Difesa CORPO",defCorpo(c),"var(--green)"],

/* ═══ CORE ITEM CARD (talenti & miglioramenti) ═══ */

    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
          <span style={{fontFamily:"Cinzel",fontWeight:700,fontSize:13,color:"var(--tx)"}}>{item.nome}</span>
          {badge&&<span style={{fontSize:8,padding:"1px 5px",borderRadius:3,background:color+"15",color:color,border:"1px solid "+color+"33"}}>{badge}</span>}

      </div>
      <button onClick={()=>setOpen(!open)} style={{width:24,height:24,borderRadius:"50%",border:"1px solid var(--b2)",background:"var(--s3)",color:"var(--tx3)",fontSize:10,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{open?"\u25b2":"\u25bc"}</button>
      <button onClick={onRemove} style={{width:24,height:24,borderRadius:"50%",border:"1px solid rgba(224,80,80,0.3)",background:"rgba(224,80,80,0.08)",color:"var(--red)",fontSize:11,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{"\u2715"}</button>

      <p style={{fontSize:11,color:"var(--tx2)",lineHeight:1.6,marginBottom:8}}>{item.desc}</p>
      {(item.pro||item.con)&&<div style={{display:"flex",gap:8,marginBottom:8}}>
        {item.pro&&<div style={{flex:1,fontSize:10,color:"var(--green)",lineHeight:1.4}}>{"\u2714"} {item.pro}</div>}
        {item.con&&<div style={{flex:1,fontSize:10,color:"var(--red)",lineHeight:1.4}}>{"\u2718"} {item.con}</div>}
      </div>}
      {item.perk&&<div style={{padding:"7px 10px",borderRadius:6,background:"rgba(64,200,200,0.07)",border:"1px solid rgba(64,200,200,0.2)",marginBottom:6}}>
        <p style={{fontSize:11,color:"var(--cyan)",lineHeight:1.5,marginBottom:hasPerkUse?6:0}}>{"\u2b50"} {item.perk}</p>
        {hasPerkUse&&<div style={{display:"flex",alignItems:"center",gap:6}}>
          <div style={{width:12,height:12,borderRadius:"50%",background:perkUses>=1?"var(--b2)":"var(--cyan)",border:"1.5px solid "+(perkUses>=1?"var(--tx3)":"var(--cyan)"),opacity:perkUses>=1?0.3:1}}/>
          <span style={{fontSize:9,color:"var(--tx3)",flex:1}}>1x/combat</span>
          {!perkUsed&&<button onClick={onUsePerk} style={{padding:"3px 9px",borderRadius:4,border:"1px solid rgba(72,200,138,0.4)",background:"rgba(72,200,138,0.1)",color:"var(--green)",fontSize:10,fontFamily:"Cinzel",fontWeight:700,cursor:"pointer"}}>Usa</button>}
          {perkUses>0&&<button onClick={onRestorePerk} style={{padding:"3px 7px",borderRadius:4,border:"1px solid var(--b2)",background:"var(--s3)",color:"var(--tx3)",fontSize:10,cursor:"pointer"}}>{"\u21ba"}</button>}
        </div>}
      </div>}
      {item.manutenzione&&<p style={{fontSize:9,color:"var(--gold)",padding:"4px 6px",borderRadius:3,background:"rgba(232,160,48,0.08)",border:"1px solid rgba(232,160,48,0.2)"}}>{"\u26a0"} {item.manutenzione}</p>}
      {item.req&&<p style={{fontSize:9,color:"var(--tx3)",marginTop:4}}>Richiede: {tById(item.req)?.nome||item.req}</p>}
    </div>}
  </div>;
}

/* ═══ CORE SPELL CARD ═══ */
function CoreSpellCard({spell,onRemove}){
  const[open,setOpen]=useState(false);
  const stileInfo=(G.STILI||{})[spell.stile]||{};
  const col=spell.stat==="ANIMA"?"var(--purple)":"var(--blue)";
  const bonus=spellBonus(spell);const cost=spellCost(spell);const minS=spellMinStat(spell);

  const usePerk=id=>up({perkUses:{...(c.perkUses||{}),[id]:getPU(id)+1}});

      <option value="">+ Seleziona talento...</option>
      {["accesso","limite","corpo","mente","anima","ibrido"].map(cat=>{const items=availT.filter(t=>t.cat===cat);if(!items.length)return null;return<optgroup key={cat} label={catLabels[cat]||cat}>{items.map(t=><option key={t.id} value={t.id} disabled={!!(t.req&&!hasTalent(c,t.req))}>{t.nome+(t.req&&!hasTalent(c,t.req)?" \ud83d\udd12":"")}</option>)}</optgroup>;})}

      {Object.keys(G.STILI||{}).map(stile=>{const items=availA.filter(a=>a.stile===stile);if(!items.length)return null;return<optgroup key={stile} label={(stileIcons[stile]||"")+" "+((G.STILI[stile]?.lbl)||stile)}>{items.map(a=><option key={a.id} value={a.id}>{a.nome} — {a.tipo}</option>)}</optgroup>;})}
    </select>}
    {selA.map(a=><CoreItemCard key={a.id} item={a} color="var(--red)"
      onRemove={()=>up({augmenti:c.augmenti.filter(id=>id!==a.id)})}
      perkUses={getPU(a.id)} hasPerkUse={hasPU(a)} onUsePerk={()=>usePerk(a.id)} onRestorePerk={()=>restorePerk(a.id)}/>)}
    {c.augmenti.length===0&&<p style={{fontSize:11,color:"var(--tx3)",fontStyle:"italic",padding:"6px 0 10px"}}>Nessun miglioramento selezionato.</p>}

    </div>

    {custModal&&<AddToCompendioModal type={custModal} onClose={()=>setCustModal(null)}
      onAdd={(item,addC)=>{pushCustomItem(custModal,item);if(addC){if(custModal==="talent"&&c.talenti.length<MAX_TALENTI)up({talenti:[...c.talenti,item.id]});else if(custModal==="augment"&&c.augmenti.length<MAX_AUGMENTI)up({augmenti:[...c.augmenti,item.id]});}setCustModal(null);}}/>}
  </div>;

/* ══════════════ SPELLS TAB — slot-cost per level ══════════════ */
function SpellsTab({c,up,isMaster}){
  const[spellModal,setSpellModal]=useState(false);
  const ms=maxSlots(c);const used=c.slotUsati||0;const avail=Math.max(0,ms-used);
  const hasMb=hasTalent(c,"gate_mb");const hasMa=hasTalent(c,"gate_ma");const hasIM=intuizioneMagica(c);
  const canL12=hasMb||hasIM;const canL34=hasMa;
  const redundant=hasMb&&hasIM;

  const allSp=G.SPELLS||[];
  const selSp=c.magie.map(id=>allSp.find(s=>s.id===id)).filter(Boolean);
  const nCt=selSp.filter(s=>s.tipo==="ct").length;

  const availCt=allSp.filter(s=>s.tipo==="ct"&&!c.magie.includes(s.id));
  const availMg=lvl=>allSp.filter(s=>s.tipo==="mg"&&s.lvl===lvl&&!c.magie.includes(s.id)&&canLearnSpell(c,s));

  const addSpell=id=>{const sp=allSp.find(s=>s.id===id);if(!sp)return;if(sp.tipo==="ct"&&nCt>=2)return;up({magie:[...c.magie,id]});};
  const removeSpell=id=>up({magie:c.magie.filter(x=>x!==id)});

  const useSlot=lvl=>{const cost=SPELL_COST[lvl]||1;if(used+cost<=ms)up({slotUsati:used+cost});};
  const restoreBy=cost=>{if(used>=cost)up({slotUsati:used-cost});};
  const restoreAll=()=>up({slotUsati:0});

  return<div style={{animation:"fadeIn 0.15s ease"}}>
    {/* Slot tracker */}
    {ms>0&&<div style={{background:"var(--s2)",borderRadius:8,padding:"10px 12px",marginBottom:12,border:"1px solid var(--b1)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <span style={{fontFamily:"Cinzel",fontSize:10,fontWeight:700,color:"var(--gold)",letterSpacing:1}}>SLOT MAGIA (punti)</span>
        <span style={{fontFamily:"JetBrains Mono",fontSize:14,fontWeight:700,color:avail===0?"var(--red)":avail<=2?"var(--gold)":"var(--green)"}}>{avail}/{ms}pt</span>
      </div>
      <div style={{display:"flex",gap:4,marginBottom:8,flexWrap:"wrap"}}>
        {Array.from({length:ms}).map((_,i)=><div key={i} style={{width:14,height:14,borderRadius:"50%",background:i<used?"var(--b2)":"var(--gold)",border:"1.5px solid "+(i<used?"var(--b1)":"var(--gold)"),opacity:i<used?0.2:1,transition:"all 0.2s"}}/>)}
      </div>
      {/* Bottoni consuma per livello */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4,marginBottom:6}}>

    {/* Magie L3-L4 */}

      <Sec style={{marginTop:12}}>Magie L3-L4 (Magia Avanzata)</Sec>

        const bonus=SPELL_BONUS[lvl];const cost=SPELL_COST[lvl];const minS=SPELL_MINS[lvl];
        const lvlSp=selSp.filter(s=>s.tipo==="mg"&&s.lvl===lvl);const av=availMg(lvl);

            <span>stat{"\u2265"}{minS}</span>
          </div>
          {av.length>0&&<select onChange={e=>{if(e.target.value){addSpell(e.target.value);e.target.value="";}}} style={{...SS.inp,width:"100%",marginBottom:6,fontSize:10}}>

          </select>}
          {lvlSp.map(s=><CoreSpellCard key={s.id} spell={s} onRemove={()=>removeSpell(s.id)}/>)}

}

/* ══════════════ COMPENDIUM PAGE ══════════════ */
function CompendiumPage({onBack}){
  const[tab,setTab]=useState("spells");const[search,setSearch]=useState("");const[stileF,setStileF]=useState("all");const[detail,setDetail]=useState(null);

    const items=(G.AUGMENTS||[]).filter(a=>mSt(a)&&mS(a));
    content.push(<div key="ag" style={{display:"grid",gridTemplateColumns:window.innerWidth>=768?"repeat(2,1fr)":"1fr",gap:6}}>{items.map(item=><Card key={item.id} item={item} type="augment"/>)}</div>);
  }else if(tab==="weapons"){

  }else if(tab==="monsters"){

    ["gregario","normale","elite","boss"].forEach(tier=>{const ms=items.filter(m=>m.tier===tier);if(!ms.length)return;content.push(<div key={tier} style={{fontFamily:"Cinzel",fontSize:12,color:"var(--gold)",margin:"12px 0 6px",letterSpacing:1,textTransform:"uppercase"}}>{tier}</div>);content.push(<div key={tier+"g"} style={{display:"grid",gridTemplateColumns:window.innerWidth>=768?"repeat(2,1fr)":"1fr",gap:6}}>{ms.map(item=><Card key={item.id} item={item} type="monster"/>)}</div>);});
  }
  return<div style={{height:"var(--app-h)",display:"flex",flexDirection:"column",overflow:"hidden"}}>
    <div style={{flexShrink:0,padding:"14px 18px",borderBottom:"1px solid var(--b1)",background:"var(--s1)",display:"flex",alignItems:"center",gap:10}}>
      <button onClick={onBack} style={{...SS.btn,padding:"6px 10px"}}>{"\u2190"}</button>
      <h2 style={{fontFamily:"Cinzel",fontSize:16,color:"var(--gold)"}}>Compendio</h2>

    <div style={{flexShrink:0,padding:"8px 18px",borderBottom:"1px solid var(--b1)",background:"var(--s2)"}}>

        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cerca..." style={{...SS.inp,flex:1,fontSize:12}}/>
        <select value={stileF} onChange={e=>setStileF(e.target.value)} style={{...SS.inp,width:110,fontSize:11}}><option value="all">Tutti stili</option>{Object.entries(G.STILI||{}).map(([k,v])=><option key={k} value={k}>{v.icon+" "+v.lbl}</option>)}</select>

    <div style={{flexShrink:0,padding:"14px 18px",borderBottom:"1px solid var(--b1)",background:"var(--s1)",display:"flex",alignItems:"center",gap:10}}>
      <button onClick={onBack} style={{...SS.btn,padding:"6px 10px"}}>{"\u2190"}</button>
      <h2 style={{fontFamily:"Cinzel",fontSize:16,color:"var(--cyan)"}}>Guida Homebrew</h2>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"12px 18px 80px",maxWidth:800,margin:"0 auto",width:"100%"}}>
      <div style={s.sec}>Filosofia Bilanciamento</div>
      <p style={s.p}>Armi e magie sono asimmetriche per design. Le armi fanno danno costante illimitato. Le magie fanno più danno ma si esauriscono. Non cercare di pareggiarle: hanno trade-off diversi.</p>
      <div style={{...s.box,fontFamily:"JetBrains Mono",fontSize:11,lineHeight:1.8}}>
        ARMI:  Cat A +1 · B +2 · C +3 · D +4  (illimitate){"\n"}
        MAGIE: Cantrip +0 · L1 +2 (1pt) · L2 +4 (2pt) · L3 +6 (3pt) · L4 +8 (4pt){"\n"}
        Pool slot = max(MENTE,ANIMA)−2  (es. MENTE 10 = 8pt)
      </div>
      <div style={s.sec}>Regole d'Oro</div>
      <div style={s.good}>✔ Rispetta i bonus per livello: non superarli{"\n"}✔ Effetti debilitanti: durata ≤3 round{"\n"}✔ PRO e CON entrambi meccanicamente rilevanti{"\n"}✔ Un talento non deve essere strettamente migliore di un altro</div>
      <div style={s.warn}>✘ Non superare i bonus della tabella standard{"\n"}✘ Non effetti permanenti senza grandi costi{"\n"}✘ Non ignorare il requisito stat minima per le magie{"\n"}✘ Non cantrip con effetti da magia L1+</div>
      <div style={s.sec}>Aggiungere in-session (Master)</div>
      <p style={s.p}>Dalla scheda, tab Azioni o Magie, il bottone <strong style={{color:"var(--gold)"}}>+ Compendio</strong> apre il form. I bonus e min-stat vengono calcolati automaticamente dal livello scelto. Salvato in localStorage, visibile subito per tutti i PG su quel dispositivo.</p>
      <div style={{...s.box,fontFamily:"JetBrains Mono",fontSize:11}}>
        PERK tracciato: scrivi "1x/combat:" nel campo Perk.{"\n"}
        Es: "1x/combat: se colpisci, il nemico subisce Stordito 1 round."{"\n"}
        Il bottone Usa/↺ appare automaticamente nella card del PG.
      </div>
    </div>
  </div>;
}

/* ═══ MANUAL PAGE ═══ */
function ManualPage({onBack}){

  const s={sec:{fontFamily:"Cinzel",fontSize:14,fontWeight:700,color:"var(--gold)",letterSpacing:1,margin:"20px 0 10px",paddingBottom:6,borderBottom:"1px solid var(--b1)"},p:{fontSize:13,color:"var(--tx2)",lineHeight:1.7,marginBottom:10},box:{background:"var(--s2)",border:"1px solid var(--b1)",borderRadius:8,padding:"10px 14px",marginBottom:10,fontSize:12,color:"var(--tx2)",lineHeight:1.6},formula:{background:"var(--s3)",borderLeft:"3px solid var(--gold)",borderRadius:6,padding:"10px 14px",fontFamily:"JetBrains Mono",fontSize:13,color:"var(--gold)",marginBottom:10},tbl:{width:"100%",borderCollapse:"collapse",marginBottom:12,fontSize:12},th:{background:"var(--s3)",color:"var(--tx2)",fontFamily:"Cinzel",fontSize:10,letterSpacing:1,padding:"7px 10px",textAlign:"left",border:"1px solid var(--b1)"},td:{padding:"6px 10px",border:"1px solid var(--b1)",color:"var(--tx2)"}};
  const Tbl=({cols,rows})=><table style={s.tbl}><thead><tr>{cols.map((c,i)=><th key={i} style={s.th}>{c}</th>)}</tr></thead><tbody>{(rows||[]).map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j} style={{...s.td,...(j===0?{color:"var(--gold)",fontFamily:"JetBrains Mono",fontSize:11}:{})}}>{c||"—"}</td>)}</tr>)}</tbody></table>;

  return<div style={{height:"var(--app-h)",display:"flex",flexDirection:"column",overflow:"hidden"}}>
    <div style={{flexShrink:0,padding:"14px 18px",borderBottom:"1px solid var(--b1)",background:"var(--s1)",display:"flex",alignItems:"center",gap:10}}>
      <button onClick={onBack} style={{...SS.btn,padding:"6px 10px"}}>{"\u2190"}</button>
      <h2 style={{fontFamily:"Cinzel",fontSize:16,color:"var(--gold)"}}>Manuale C.O.R.E.</h2>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"12px 18px 80px",maxWidth:900,margin:"0 auto",width:"100%"}}>
      <div style={{...s.box,background:"linear-gradient(135deg,rgba(232,160,48,0.08),rgba(232,160,48,0.03))",borderColor:"rgba(232,160,48,0.25)"}}>
        <div style={{fontFamily:"Cinzel",fontSize:12,color:"var(--gold)",marginBottom:6}}>Filosofia</div>
        <p style={{...s.p,margin:0}}>Un dado, tre caratteristiche, regole modulari. Armi = costante illimitato. Magie = burst limitato. La complessità cresce col personaggio, non con le regole.</p>
      </div>
      <div style={s.sec}>1. Caratteristiche & Creazione</div>
      <div style={s.formula}>HP = CORPO + MENTE + ANIMA · Cap Lv1: max {CAP_CREAZIONE}/stat · 12 punti totali</div>
      <Tbl cols={["Stat","Governa","Difende vs"]} rows={[["CORPO","Forza, resistenza","Attacchi fisici"],["MENTE","Intelligenza, magia, tech","Magie mentali"],["ANIMA","Carisma, volontà","Magie sociali, paura"]]}/>

        ["L1","+2","1pt","Stat≥6","Magia Base o MENTE≥10 (Intuizione Magica)"],
        ["L2","+4","2pt","Stat≥8","Magia Base o MENTE≥10 (Intuizione Magica)"],
        ["L3","+6","3pt","Stat≥10","Magia Avanzata (obbligatorio, nessuna eccezione)"],
        ["L4","+8","4pt","Stat≥12","Magia Avanzata (obbligatorio, nessuna eccezione)"],

      <div style={{...s.box,fontSize:11,color:"var(--red)"}}>3+ condizioni attive: −2 a tutti i tiri (globale)</div>

        <div style={s.box}><strong style={{color:"var(--tx)"}}>Riposo Lungo</strong><br/>HP + slot + perkUses + condizioni: tutto ripristinato</div>
      </div>
      <div style={s.sec}>9. Punti Eroe ⭐</div>
      <p style={s.p}>Partenza: 2 PE · Cap: 3 PE · Non si recuperano automaticamente — il Master li concede a discrezione per giocata eccezionale. Effetto: +1 a +6 al tiro, o successo automatico.</p>
    </div>
  </div>;
}
