<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<script type="text/babel">
const{useState,useEffect,useCallback,useRef}=React;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const BASE=()=>{let b=window.GITHUB_BASE||"";if(b.endsWith("/"))b=b.slice(0,-1);return b;};
async function fetchJ(u){try{const r=await fetch(u+"?t="+Date.now());if(!r.ok)return null;return await r.json();}catch{return null;}}
async function H(s){const e=new TextEncoder().encode(s);const h=await crypto.subtle.digest("SHA-256",e);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");}
function hex2b(h){const b=new Uint8Array(h.length/2);for(let i=0;i<h.length;i+=2)b[i/2]=parseInt(h.substr(i,2),16);return b;}
async function aesDec(stored,passHash){try{const{i,d}=JSON.parse(stored);const k=await crypto.subtle.importKey("raw",hex2b(passHash).slice(0,32),{name:"AES-GCM"},false,["decrypt"]);const dec=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(i)},k,new Uint8Array(d));return new TextDecoder().decode(dec);}catch{return null;}}
async function ghPut(path,content,token,accId,isMaster,accName){
  if(!isMaster&&accId){const allowed=path==="data/manifest.json"||path.startsWith(`data/${accId}/`);if(!allowed)return false;}
  const u=new URL(BASE());const user=u.hostname.split(".")[0];const repo=u.pathname.replace(/^\/|\/$/g,"");
  const api=`https://api.github.com/repos/${user}/${repo}/contents/${path}`;
  const hd={"Authorization":`token ${token}`,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  let sha=null;try{const r=await fetch(api+"?t="+Date.now(),{headers:{...hd,"If-None-Match":""},cache:"no-store"});if(r.ok){sha=(await r.json()).sha;}}catch{}
  const body={message:`[${accName||accId||"?"}] Update ${path}`,content:btoa(unescape(encodeURIComponent(content)))};
  if(sha)body.sha=sha;
  return(await fetch(api,{method:"PUT",headers:{...hd,"Content-Type":"application/json"},body:JSON.stringify(body)})).ok;
}

/* ═══ CORE HELPERS ═══ */
const G=window; // access SPELLS, TALENTS, etc from core-data.js
function tById(id){return G.TALENTS?.find(t=>t.id===id)}
function sById(id){return G.SPELLS?.find(s=>s.id===id)}
function aById(id){return G.AUGMENTS?.find(a=>a.id===id)}
function catCap(c){return c.talenti.includes('cap_15')?15:c.talenti.includes('cap_12')?12:10}
function hpMax(c){return c.corpo+c.mente+c.anima}
function hpPct(c){const mx=hpMax(c);return mx>0?Math.max(0,c.hpCurrent/mx):0;}
function woundTier(c){const mx=hpMax(c),lost=mx-c.hpCurrent,t=Math.floor(mx/3);if(c.hpCurrent<=0)return 3;if(lost>=t*2)return 2;if(lost>=t)return 1;return 0;}
function wInfo(t){return(G.WOUND_TIERS||[])[Math.min(t,3)]||{nome:'?',penalita:0};}
function maxSlots(c){return Math.max(0,Math.max(c.mente,c.anima)-2)}
function hasTalent(c,id){return c.talenti.includes(id)}
function canUseCat(c,cat){const w=G.WCAT[cat];return!w.req||hasTalent(c,w.req)}
function armorData(id){return(G.ARMORS||[])[id]||G.ARMORS[0]}
function shieldData(id){return(G.SHIELDS||[]).find(s=>s.id===id)||G.SHIELDS[0]}
function totalDefBonus(c){return armorData(c.armatura).bonus+shieldData(c.scudo).bonus}
function totalPenMente(c){return armorData(c.armatura).penMente+shieldData(c.scudo).penMente}
function totalPenAnima(c){return armorData(c.armatura).penAnima+shieldData(c.scudo).penAnima}
function movement(c){return armorData(c.armatura).movimento}
function initBonus(c){const s=c.competenza;if(!s)return 0;return c[s]+(G.WCAT[c.armaCat]?.initMod||0);}
function atkBonus(c){const stat=c.armaMagi?c.mente:c.corpo;const comp=c.competenza===(c.armaMagi?'mente':'corpo')?2:0;return stat+(G.WCAT[c.armaCat]?.bonus||0)+comp;}
function defCorpo(c){return c.corpo+totalDefBonus(c)}
function displayName(f){return f.replace(/-(classic|core)\.json$/,"").replace(/\.json$/,"").replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());}

function newCoreChar(n){return{id:uid(),name:n||"Nuovo PG",system:"core",corpo:4,mente:4,anima:4,hpCurrent:12,competenza:null,armaCat:"B",armaPerk:"b1",armaNome:"",armaDist:false,armaMagi:false,scudo:0,armatura:0,talenti:[],augmenti:[],magie:[],conditions:[],heroPoints:2,notes:"",backstory:""};}

const SS={
  inp:{background:'var(--s3)',border:'1px solid var(--b1)',borderRadius:6,color:'var(--tx)',fontFamily:'Outfit',fontSize:13,padding:'6px 9px',outline:'none',boxSizing:'border-box'},
  btn:{borderRadius:6,border:'1px solid var(--b2)',background:'none',color:'var(--tx2)',fontFamily:'Outfit',fontSize:12,fontWeight:500,padding:'6px 12px',cursor:'pointer'},
  gold:{borderRadius:6,border:'1.5px solid rgba(232,160,48,0.4)',background:'rgba(232,160,48,0.1)',color:'var(--gold)',fontFamily:'Cinzel',fontWeight:700,fontSize:12,cursor:'pointer',letterSpacing:0.5,textAlign:'center'},
  green:{borderRadius:6,border:'1.5px solid rgba(72,200,138,0.4)',background:'rgba(72,200,138,0.08)',color:'var(--green)',fontFamily:'Cinzel',fontWeight:700,fontSize:12,cursor:'pointer',textAlign:'center'},
  red:{borderRadius:6,border:'1.5px solid rgba(224,80,80,0.3)',background:'rgba(224,80,80,0.08)',color:'var(--red)',fontFamily:'Cinzel',fontWeight:700,fontSize:12,cursor:'pointer',textAlign:'center'},
  card:{background:'var(--s1)',border:'1px solid var(--b1)',borderRadius:10,padding:12,marginBottom:8},
  po:{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.85)',backdropFilter:'blur(8px)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:999,padding:14},
  pc:{background:'linear-gradient(180deg,var(--s1),var(--bg))',border:'1.5px solid rgba(232,160,48,0.3)',borderRadius:12,padding:'18px 16px',width:'100%',maxWidth:440,boxShadow:'0 12px 48px rgba(0,0,0,0.6)'},
};
const TABS=[{id:"sheet",icon:"⚔️",label:"Scheda"},{id:"actions",icon:"🎭",label:"Azioni"},{id:"spells",icon:"📕",label:"Magie"},{id:"dice",icon:"🎲",label:"Dadi"},{id:"notes",icon:"📜",label:"Note"},{id:"save",icon:"💾",label:"Salva"}];

/* ═══ APP ═══ */
function App(){
  const[screen,setScreen]=useState("init");
  const[manifest,setManifest]=useState(null);
  const[accId,setAccId]=useState(null);
  const[ghToken,setGhToken]=useState(null);
  const[char,setChar]=useState(null);
  const[charMeta,setCharMeta]=useState(null);
  const[loading,setLoading]=useState(true);
  const[chars,setChars]=useState([]);
  const[loadingChars,setLoadingChars]=useState(false);
  const[toast,setToast]=useState(null);
  const fileRef=useRef(null);

  const ENC_TOKEN='{"i":[5,170,185,0,120,150,2,170,111,56,153,240],"d":[99,191,61,134,207,114,167,103,79,15,137,76,15,159,247,79,239,75,171,144,32,229,210,227,107,168,22,47,40,79,93,7,150,213,255,74,224,254,20,46,180,100,113,171,93,123,79,39,146,125,6,65,122,52,153,122,191,93,144,66,111,142,124,91,6,54,203,44,91,121,125,158,51,17,116,241,47,74,159,125,139,198,36,6,1,243,121,130,128,78,149,196,79,56,93,105,226,45,151,112,161,86,65,142,181,80,111,155,77]}';
  const decToken=async()=>{try{const h=await H("ttrpg-tk-2026");return await aesDec(ENC_TOKEN,h);}catch{return null;}};

  useEffect(()=>{(async()=>{
    const m=await fetchJ(BASE()+"/data/manifest.json");setManifest(m);
    try{
      const auth=JSON.parse(sessionStorage.getItem("core_auth"));
      if(auth&&auth.accId&&(Date.now()-auth.ts)<3600000){
        setAccId(auth.accId);
        const tk=await decToken();if(tk)setGhToken(tk);
        setScreen("list");setLoading(false);return;
      }
    }catch{}
    setScreen("login");setLoading(false);
  })();},[]);
  const acc=manifest?.accounts?.find(a=>a.id===accId);
  const isMaster=acc?.isMaster||false;
  const up=useCallback(u=>setChar(p=>({...p,...u})),[]);

  const listChars=async(owner)=>{
    const u=new URL(BASE());const user=u.hostname.split(".")[0];const repo=u.pathname.replace(/^\/|\/$/g,"");
    const hd=ghToken?{"Authorization":`token ${ghToken}`,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}:{"Accept":"application/vnd.github+json"};
    try{
      const r=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data/${owner}?t=`+Date.now(),{headers:hd,cache:"no-store"});
      if(!r.ok)return[];const files=await r.json();if(!Array.isArray(files))return[];
      return files.filter(f=>f.name.endsWith("-core.json")&&f.type==="file").map(f=>({file:f.name,name:displayName(f.name)}));
    }catch{return[];}
  };

  const loadAllChars=async()=>{
    setLoadingChars(true);
    const secs=[];
    const own=await listChars(accId);
    if(own.length)secs.push({label:"I Miei PG",owner:accId,chars:own,color:"var(--gold)"});
    if(isMaster){for(const a of(manifest?.accounts?.filter(x=>x.id!==accId)||[])){const ch=await listChars(a.id);if(ch.length)secs.push({label:`PG di ${a.name}`,owner:a.id,chars:ch,color:a.color||"var(--blue)"});}}
    setChars(secs);setLoadingChars(false);
  };

  const loadChar=async(owner,file)=>{
    setLoading(true);const raw=await fetchJ(`${BASE()}/data/${owner}/${file}`);setLoading(false);
    if(!raw)return null;const ch=raw.character||raw;
    if(ch.corpo!==undefined)return ch;return null;
  };

  const saveChar=async(owner,file,charObj)=>{
    if(!ghToken)return false;
    const payload={account:acc?.name,accountId:accId,exportedAt:new Date().toISOString(),character:charObj};
    return await ghPut(`data/${owner}/${file}`,JSON.stringify(payload,null,2),ghToken,accId,isMaster,acc?.name);
  };

  const saveNewChar=async(charObj)=>{
    if(!ghToken||!accId)return null;
    const fname=charObj.name.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")+"-core.json";
    const ok=await ghPut(`data/${accId}/${fname}`,JSON.stringify({account:acc?.name,accountId:accId,exportedAt:new Date().toISOString(),character:charObj},null,2),ghToken,accId,isMaster,acc?.name);
    if(!ok)return null;
    setToast("PG Core creato!");setTimeout(()=>setToast(null),4000);
    return{owner:accId,file:fname};
  };

  useEffect(()=>{if(screen==="list"&&accId&&ghToken)loadAllChars();},[screen,accId,ghToken]);

  return React.createElement("div",{style:{height:"var(--app-h)",display:"flex",flexDirection:"column",overflow:"hidden",background:"var(--bg)"}},
    loading&&React.createElement(Loader,null),

    !loading&&screen==="login"&&React.createElement(LoginScreen,{manifest,onAuth:async(id)=>{
      setAccId(id);const tk=await decToken();if(tk)setGhToken(tk);setScreen("list");
    }}),

    !loading&&screen==="list"&&React.createElement(CharList,{acc,isMaster,chars,loadingChars,
      onBack:()=>{window.location.href=BASE()+"/";},
      onNew:()=>{setChar(newCoreChar(""));setCharMeta(null);setScreen("sheet");},
      onLoad:async(owner,file)=>{const c=await loadChar(owner,file);if(c){setChar(c);setCharMeta({owner,file});setScreen("sheet");}else alert("Errore caricamento.");},
      onManual:()=>setScreen("manual"),
    }),

    !loading&&screen==="manual"&&React.createElement(ManualPage,{onBack:()=>setScreen("list")}),

    !loading&&screen==="sheet"&&char&&React.createElement(CoreSheet,{c:char,up,acc,charMeta,ghToken,isMaster,accId,
      saveChar,saveNewChar,setCharMeta,
      onBack:()=>{setChar(null);setCharMeta(null);setScreen("list");},
    }),

    toast&&React.createElement("div",{style:{position:"fixed",bottom:30,left:"50%",transform:"translateX(-50%)",zIndex:100,padding:"10px 20px",borderRadius:8,background:"var(--s1)",border:"1.5px solid rgba(72,200,138,0.4)",color:"var(--green)",fontFamily:"Cinzel",fontSize:12,fontWeight:700,boxShadow:"0 6px 24px rgba(0,0,0,0.5)"}},"\u2705 ",toast)
  );
}

function Loader(){return React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"var(--app-h)"}},
  React.createElement("div",{style:{textAlign:"center"}},
    React.createElement("div",{style:{width:40,height:40,border:"3px solid var(--b1)",borderTop:"3px solid var(--gold)",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 16px"}}),
    React.createElement("p",{style:{color:"var(--gold)",fontFamily:"Cinzel",fontSize:14}},"Caricamento...")
  )
);}

/* ═══ LOGIN ═══ */
function LoginScreen({manifest,onAuth}){
  const[user,setUser]=useState("");const[pw,setPw]=useState("");const[err,setErr]=useState("");const[show,setShow]=useState(false);
  const accs=manifest?.accounts||[];
  const check=async()=>{
    if(!user.trim()||pw.length<6){setErr("Credenziali non valide");return;}
    const found=accs.find(a=>a.name.toLowerCase()===user.trim().toLowerCase()||a.id===user.trim().toLowerCase());
    if(!found){setErr("Utente non trovato");return;}
    const hashed=await H(pw+"$ttrpg-op-2026$");const dh=await H(hashed);
    if(dh===found.ix)onAuth(found.id);else setErr("Password errata");
  };
  return React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"var(--app-h)",padding:"0 20px"}},
    React.createElement("div",{style:{textAlign:"center",maxWidth:340,width:"100%"}},
      React.createElement("h1",{style:{fontFamily:"Cinzel",fontSize:28,fontWeight:900,color:"var(--gold)",marginBottom:4,letterSpacing:3}},"C.O.R.E."),
      React.createElement("p",{style:{color:"var(--tx3)",fontSize:11,fontFamily:"JetBrains Mono",marginBottom:30}},"Compact Open Rules Engine"),
      React.createElement("input",{value:user,onChange:e=>setUser(e.target.value),placeholder:"Nome utente...",onKeyDown:e=>e.key==="Enter"&&check(),style:{...SS.inp,width:"100%",fontSize:15,textAlign:"center",padding:"12px",marginBottom:10}}),
      React.createElement("div",{style:{position:"relative",marginBottom:16}},
        React.createElement("input",{type:show?"text":"password",value:pw,onChange:e=>setPw(e.target.value),onKeyDown:e=>e.key==="Enter"&&check(),placeholder:"Password...",style:{...SS.inp,width:"100%",fontSize:15,textAlign:"center",padding:"12px 44px 12px 12px"}}),
        React.createElement("button",{onClick:()=>setShow(!show),style:{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"var(--tx3)",fontSize:16,cursor:"pointer"}},show?"\uD83D\uDE48":"\uD83D\uDC41")
      ),
      err&&React.createElement("p",{style:{color:"var(--red)",fontSize:12,marginBottom:12}},err),
      React.createElement("button",{onClick:check,style:{...SS.gold,width:"100%",padding:"12px 0",fontSize:15}},"Entra"),
      React.createElement("button",{onClick:()=>window.location.href=BASE()+"/",style:{marginTop:16,background:"none",border:"none",color:"var(--tx3)",fontSize:11,cursor:"pointer",fontFamily:"Outfit"}},"← Torna a Classic")
    )
  );
}

/* ═══ CHAR LIST ═══ */
function CharList({acc,isMaster,chars,loadingChars,onBack,onNew,onLoad,onManual}){
  if(loadingChars)return React.createElement("div",{style:{display:"flex",flexDirection:"column",height:"var(--app-h)"}},
    React.createElement("div",{style:{padding:"14px 18px",borderBottom:"1px solid var(--b1)",background:"var(--s1)",display:"flex",alignItems:"center",gap:10}},
      React.createElement("button",{onClick:onBack,style:{...SS.btn,padding:"6px 10px"}},"←"),
      React.createElement("h2",{style:{fontFamily:"Cinzel",fontSize:16,color:"var(--gold)",flex:1}},acc?.name),
      React.createElement("span",{style:{fontSize:10,color:"var(--gold)",fontFamily:"JetBrains Mono"}},"C.O.R.E.")
    ),
    React.createElement("div",{style:{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}},
      React.createElement("div",{style:{textAlign:"center"}},
        React.createElement("div",{style:{width:36,height:36,border:"3px solid var(--b1)",borderTop:"3px solid var(--gold)",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 14px"}}),
        React.createElement("p",{style:{color:"var(--gold)",fontFamily:"Cinzel",fontSize:12}},"Caricamento PG...")
      )
    )

  return React.createElement("div",{style:{height:"var(--app-h)",display:"flex",flexDirection:"column",overflow:"hidden"}},
    React.createElement("div",{style:{flexShrink:0,padding:"14px 18px",borderBottom:"1px solid var(--b1)",background:"var(--s1)",display:"flex",alignItems:"center",gap:10}},
      React.createElement("button",{onClick:onBack,style:{...SS.btn,padding:"6px 10px"}},"←"),
      React.createElement("h2",{style:{fontFamily:"Cinzel",fontSize:16,color:"var(--gold)",flex:1}},acc?.name),
      isMaster&&React.createElement("span",{style:{fontSize:9,color:"var(--gold)",opacity:0.6,fontFamily:"Cinzel"}},"👑 Master"),
      React.createElement("span",{style:{fontSize:10,color:"var(--gold)",fontFamily:"JetBrains Mono",background:"var(--gbg)",padding:"3px 8px",borderRadius:4}},"C.O.R.E.")
    ),
    React.createElement("div",{style:{flex:1,overflowY:"auto",padding:18,paddingBottom:100}},
      chars.map((sec,si)=>React.createElement("div",{key:si,style:{marginBottom:20}},
        React.createElement("div",{style:{borderLeft:`3px solid ${sec.color}`,paddingLeft:8,marginBottom:8}},
          React.createElement("span",{style:{fontFamily:"Cinzel",fontWeight:700,fontSize:11,color:sec.color,letterSpacing:1}},sec.label.toUpperCase())
        ),
        React.createElement("div",{style:{display:"grid",gridTemplateColumns:window.innerWidth>=768?"repeat(2,1fr)":"1fr",gap:8}},
          sec.chars.map((gc,i)=>React.createElement("button",{key:i,onClick:()=>onLoad(sec.owner,gc.file),style:{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:10,border:"1px solid var(--b1)",background:"var(--s1)",cursor:"pointer",textAlign:"left",width:"100%"}},
            React.createElement("div",{style:{width:36,height:36,borderRadius:8,background:"var(--gbg)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Cinzel",fontWeight:900,fontSize:16,color:"var(--gold)",flexShrink:0}},gc.name?gc.name[0]:"?"),
            React.createElement("span",{style:{fontFamily:"Cinzel",fontWeight:700,fontSize:14,color:"var(--tx)"}},gc.name),
            React.createElement("span",{style:{marginLeft:"auto",color:"var(--tx3)",fontSize:14}},"→")
          ))
        )
      )),
      chars.length===0&&React.createElement("p",{style:{textAlign:"center",color:"var(--tx3)",fontStyle:"italic",padding:"20px 0"}},"Nessun PG Core trovato."),
      React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:16}},
        React.createElement("button",{onClick:onNew,style:{...SS.gold,padding:"14px 0",fontSize:13}},"✨ Nuovo PG"),
        React.createElement("button",{onClick:onManual,style:{...SS.btn,padding:"14px 0",fontSize:13,borderColor:"rgba(232,160,48,0.3)",color:"var(--gold)"}},"📖 Manuale")
      )
    )
  );
}

/* ═══ CORE SHEET ═══ */
function CoreSheet({c,up,acc,charMeta,ghToken,isMaster,accId,saveChar,saveNewChar,setCharMeta,onBack}){
  const[tab,setTab]=useState("sheet");
  const[saving,setSaving]=useState(false);
  const mx=hpMax(c),pct=hpPct(c),tier=woundTier(c),wi=wInfo(tier);
  const hc=pct>0.6?"var(--green)":pct>0.3?"var(--gold)":"var(--red)";

  const doSave=async()=>{
    if(!ghToken)return;setSaving(true);
    let ok;
    if(charMeta){ok=await saveChar(charMeta.owner,charMeta.file,c);}
    else{const res=await saveNewChar(c);ok=!!res;if(res)setCharMeta(res);}
    setSaving(false);
    if(ok)setTimeout(()=>setTab("sheet"),1500);
  };

      React.createElement("p",{style:s.p},"Difesa totale = CORPO + armatura + scudo. Nessun cap, bilanciato dalle penalità cumulate."),
